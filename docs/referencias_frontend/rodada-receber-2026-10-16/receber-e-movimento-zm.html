<script>
(() => {
 const root=document.getElementById('zm-receivable-motion');
 const areas={inicio:'Visão geral',financeiro:'Financeiro',vendas:'Vendas',estoque:'Estoque',mais:'Mais'};
 const children={
  'financeiro:conta-fornecedor':{title:'Fornecedor de alimentos',label:'Valor a pagar',amount:'R$ 680,00',lines:[['Situação','Em aberto'],['Vencimento','16 de outubro'],['Origem','Compra de produtos'],['Forma prevista','Boleto']]},
  'financeiro:conta-embalagens':{title:'Fornecedor de embalagens',label:'Valor a pagar',amount:'R$ 600,00',lines:[['Situação','Em aberto'],['Vencimento','18 de outubro'],['Origem','Compra de embalagens']]},
  'financeiro:conta-ana':{title:'Ana Souza',label:'Saldo a receber',amount:'R$ 1.250,00',lines:[['Situação','Em aberto'],['Vencimento','17 de outubro'],['Origem','Venda de cestas']]},
  'financeiro:conta-bruno':{title:'Bruno Lima',label:'Saldo a receber',amount:'R$ 700,00',lines:[['Situação','Parcial'],['Vencimento','18 de outubro'],['Origem','Venda de cestas']]},
  'financeiro:contas':{title:'Contas e cartões',future:true,rows:[['Banco de exemplo','Conta da empresa · final 0821'],['Cartão de exemplo','Faturas e parcelas']]},
  'financeiro:documentos':{title:'Extratos e faturas',future:true,rows:[['Fatura de outubro','Cartão de exemplo · Em revisão'],['Extrato de outubro','Banco de exemplo · Conferido']]},
  'estoque:produtos':{title:'Produtos',rows:[['Arroz · pacote de 5 kg','12 pacotes disponíveis · Abaixo do mínimo'],['Óleo · frasco de 900 ml','36 frascos disponíveis'],['Café · pacote de 250 g','24 pacotes disponíveis']]},
  'estoque:compras':{title:'Compras',rows:[['Compra de alimentos','Fornecedor de alimentos · R$ 680,00'],['Compra de embalagens','Fornecedor de embalagens · R$ 600,00']]},
  'estoque:cestas':{title:'Cestas e montagens',rows:[['Cesta Básica Completa','Composição e montagens'],['Cesta de Carne','Composição e montagens']],basket:true},
  'estoque:movimentacoes':{title:'Movimentações',rows:[['Entrada de produtos','Compra confirmada'],['Montagem de 8 cestas','Consumo de produtos e entrada de cestas'],['Venda de 8 cestas','Saída de cestas prontas']]},
  'estoque:cesta-basica':{title:'Cesta Básica Completa',rows:[['Composição','Consultar produtos e quantidades'],['Registrar montagem','Padrão ou personalizada'],['Histórico de montagens','Registros anteriores']]},
  'vendas:clientes':{title:'Clientes',rows:[['Ana Souza','Cadastro e histórico financeiro'],['Bruno Lima','Cadastro e histórico financeiro']]},
  'vendas:venda':{title:'Detalhe da venda',label:'Total da venda',amount:'R$ 1.240,00',lines:[['Quantidade','8 cestas'],['Situação','Confirmada'],['Origem','Estoque de cestas prontas']]},
  'mais:relatorios':{title:'Relatórios',rows:[['Vendas por período','Consultar e exportar'],['Resumo financeiro','Consultar e exportar'],['Posição de estoque','Consultar e exportar']]},
  'mais:impressao':{title:'Impressão e formulários',rows:[['Relatório preenchido','Pré-visualizar, salvar PDF ou imprimir'],['Formulário em branco','Folha para preencher à caneta']]},
  'mais:configuracoes':{title:'Configurações e conexão',rows:[['Aparência','Tema, cores e acessibilidade'],['Conexão com o servidor','Disponibilidade e pareamento']]},
  'mais:backup':{title:'Backup',rows:[['Cópias de segurança','Consultar backups'],['Recuperação','Fluxo com revisão e confirmação']]}
 };
 const accounts=[{id:'ana',name:'Ana Souza',description:'Venda #1042 · Cestas básicas',origin:'Venda fiada #1042',saleNumber:1042,saleDate:'2026-10-10',amount:15000,due:'2026-10-17',planned:'A prazo'},{id:'bruno',name:'Bruno Lima',description:'Venda #1043 · Cestas básicas',origin:'Venda fiada #1043',saleNumber:1043,saleDate:'2026-10-11',amount:20000,due:'2026-10-18',planned:'A prazo'}];
 const methods={PIX:'Pix',CASH:'Dinheiro',CARD:'Cartão',OTHER:'Outro'};
 const money=cents=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(cents/100);
 const moneyValue=cents=>new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(cents/100);
 const dateLabel=value=>{const [y,m,d]=value.split('-').map(Number);return new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(Date.UTC(y,m-1,d)));};
 const parseMoney=value=>{const clean=value.trim().replace(/^R\$\s*/, '');if(!/^(?:\d+|\d{1,3}(?:\.\d{3})+)(?:,\d{1,2})?$/.test(clean))return null;const [integer,fraction='']=clean.replaceAll('.','').split(',');const cents=Number(integer)*100+Number(fraction.padEnd(2,'0'));return Number.isSafeInteger(cents)?cents:null;};
 const validDate=value=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(value))return false;const [y,m,d]=value.split('-').map(Number);return y>=1900&&y<=9999&&new Date(Date.UTC(y,m-1,d)).toISOString().slice(0,10)===value;};
 const esc=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
 const blankDraft=()=>({mode:'full',amount:'',date:'2026-10-16',method:'',notes:''});
 const baselinePayments=()=>[{id:'initial-ana-1',account:'ana',amount:5000,date:'2026-10-14',method:'PIX',notes:''}];
 const states={};
 const snapshot=()=>Object.fromEntries(Object.entries(states).map(([key,s])=>[key,{area:s.area,stacks:s.stacks,design:{...s.design},selected:s.selected,filter:s.filter,range:s.range,payments:s.payments,draft:s.draft,draftFor:s.draftFor,lastPayment:s.lastPayment}]));
 const save=device=>{if(window.openai?.setWidgetState){const s=states[device];const privateContent={journeyVersion:4,devices:snapshot()};window.openai.setWidgetState({modelContent:{prototype:'Receber e movimento ZM',device,area:s.area,page:s.stacks[s.area].at(-1),selectedReceivable:s.selected,motion:s.design.motion,payments:s.payments.map(p=>({receivable:p.account,amountCents:p.amount,method:p.method,date:p.date})),productionImplementation:false},privateContent:JSON.stringify(privateContent).length<14000?privateContent:null}).catch(()=>{});}};
 const icon=name=>{const el=document.createElement('i');el.dataset.lucide=name;el.setAttribute('aria-hidden','true');return el;};
 const make=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;};
 for(const app of root.querySelectorAll('.app')) {
  const device=app.dataset.device;
  app.appendChild(document.getElementById('zm-receive-shell').content.cloneNode(true));
  const initialPages=()=>['receber'];
  const s={area:'financeiro',stacks:Object.fromEntries(Object.keys(areas).map(key=>[key,key==='financeiro'?initialPages():['resumo']])),design:{appearance:'chat',radius:32,scenario:'normal',query:'loaded',motion:'standard'},selected:'ana',filter:'open',range:'week',payments:baselinePayments(),draft:blankDraft(),draftFor:'ana',lastPayment:null,busy:false,errors:{},serviceError:false,failedOnce:false,queryBusy:false};states[device]=s;
  const content=app.querySelector('.content-inner'),title=app.querySelector('.page-title'),back=app.querySelector('.back');
  const reducePreference=window.matchMedia('(prefers-reduced-motion:reduce)');
  const motionAllowed=()=>s.design.motion!=='reduced'&&!reducePreference.matches;
  const renderDesign=()=>{app.style.colorScheme=s.design.appearance==='chat'?'light dark':s.design.appearance;app.style.setProperty('--radius',s.design.radius+'px');app.style.setProperty('--field-radius',Math.max(24,s.design.radius-4)+'px');app.dataset.motion=String(motionAllowed());if(!motionAllowed())app.getAnimations({subtree:true}).forEach(animation=>animation.cancel());};
  reducePreference.addEventListener('change',renderDesign);
  const animateChange=(element,kind='page',direction=1)=>{if(!motionAllowed()||!element?.animate)return;element.getAnimations().forEach(animation=>animation.cancel());const distance=kind==='calendar'?8:6;element.animate([{opacity:.55,transform:`translateY(${distance*direction}px)`},{opacity:1,transform:'translateY(0)'}],{duration:kind==='calendar'?180:220,easing:'cubic-bezier(.2,0,0,1)'});};
  const availableAccounts=()=>accounts;

   s.busy=true;s.serviceError=false;render();
   setTimeout(()=>{
    s.busy=false;
    if(s.design.scenario==='failure'&&!s.failedOnce){s.failedOnce=true;s.serviceError=true;render();save(device);return;}
    const payment={id:`demo-${s.payments.length+1}`,account:s.selected,amount:paymentAmount(),date:s.draft.date,method:s.draft.method,notes:s.draft.notes.trim()};
    s.payments.push(payment);s.lastPayment=payment.id;s.draft=blankDraft();s.draftFor=null;
    s.stacks.financeiro=['receber',accountPage(),'conclusao'];render();save(device);
   },850);
  }
  app.addEventListener('click',event=>{
   const button=event.target.closest('button');if(!button||!app.contains(button))return;
   if(s.busy)return;
   if(button.dataset.action){
    const action=button.dataset.action;
    if(action==='open-date')openCalendar();
    else if(action==='today'){s.range='today';s.filter='open';s.stacks.financeiro=['resumo','pagar'];render();save(device);}
    else if(action==='week'){s.range='week';s.filter='all';s.stacks.financeiro=['resumo','pagar'];render();save(device);}
    else if(action==='retry-query'){
     if(s.queryBusy)return;s.queryBusy=true;render();
     setTimeout(()=>{s.queryBusy=false;s.design.query='loaded';render();save(device);},650);
    }
    else if(action==='register'||action==='edit')openForm();
    else if(action==='review'){
     if(validateDraft()){if(s.draft.mode==='partial')s.draft.amount=moneyValue(paymentAmount());s.serviceError=false;navigate('financeiro','conferir');}
     else{render();content.querySelector(`[data-field="${Object.keys(s.errors)[0]}"]`)?.focus();save(device);}
    }
    else if(action==='confirm')confirmPayment();
    else if(action==='view-account'){backMotion=true;s.stacks.financeiro=['receber',accountPage()];render();save(device);}
    else if(action==='view-sale')navigate('financeiro','venda-origem');
    else if(action==='list'){backMotion=true;s.stacks.financeiro=['receber'];render();save(device);}
    else if(action==='restart'){
     Object.assign(s,{area:'financeiro',selected:'ana',filter:'open',range:'week',payments:baselinePayments(),draft:blankDraft(),draftFor:'ana',lastPayment:null,errors:{},serviceError:false,failedOnce:false});
     s.design.query='loaded';s.stacks=Object.fromEntries(Object.keys(areas).map(area=>[area,area==='financeiro'?initialPages():['resumo']]));render();save(device);
    }
   }
   else if(button.dataset.calendarDate)chooseDate(button.dataset.calendarDate);
   else if(button.dataset.calendarAction){if(button.dataset.calendarAction==='today')chooseDate('2026-10-16');else content.querySelector('.date-dialog').close();}
   else if(button.dataset.calendarStep){const dialog=content.querySelector('.date-dialog'),[y,m]=dialog.dataset.month.split('-').map(Number);dialog.dataset.month=new Date(Date.UTC(y,m-1+Number(button.dataset.calendarStep),1)).toISOString().slice(0,7);drawCalendar(dialog);}
   else if(button.dataset.edit)openForm(button.dataset.edit);
   else if(button.dataset.focus)content.querySelector(`[data-field="${button.dataset.focus}"]`)?.focus();
   else if(button.dataset.area){s.area=button.dataset.area;render();save(device);}
   else if(button.dataset.go){const [area,page]=button.dataset.go.split(':');navigate(area,page);}
   else if(button.dataset.finance){if(button.dataset.finance==='pagar'){s.range='week';s.filter='all';}s.stacks.financeiro=[...s.stacks.financeiro.slice(0,-1),button.dataset.finance];render();save(device);}
  });
  app.addEventListener('input',event=>{
   const field=event.target.dataset.field;if(!field||s.busy)return;
   s.draft[field]=event.target.value;
   if(field==='amount')updateRemaining();
  });
  app.addEventListener('change',event=>{
   if(event.target.hasAttribute('data-payment-mode')){s.draft.mode=event.target.value;updatePaymentMode();save(device);}
   else if(event.target.hasAttribute('data-filter')){s.filter=event.target.value;render();save(device);}
   else if(event.target.dataset.field){s.draft[event.target.dataset.field]=event.target.value;refreshFieldError(event.target.dataset.field);save(device);}
  });
  app.addEventListener('focusout',event=>{
   const field=event.target.dataset.field;if(!field||field==='date')return;
   if(field==='amount'){const cents=parseMoney(s.draft.amount);if(cents!==null){s.draft.amount=moneyValue(cents);event.target.value=s.draft.amount;}}
   refreshFieldError(field);
   save(device);
  });
  app.addEventListener('keydown',event=>{
   const day=event.target.dataset.calendarDate;
   if(day&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End','PageUp','PageDown'].includes(event.key)){
    event.preventDefault();const dialog=content.querySelector('.date-dialog'),value=new Date(day+'T00:00:00Z');
    if(event.key==='PageUp'||event.key==='PageDown'){
     const offset=(event.key==='PageUp'?-1:1)*(event.shiftKey?12:1),month=value.getUTCMonth()+offset,year=value.getUTCFullYear();
     const last=new Date(Date.UTC(year,month+1,0)).getUTCDate();value.setUTCDate(1);value.setUTCMonth(month);value.setUTCDate(Math.min(Number(day.slice(8)),last));
    }else{const offset={ArrowLeft:-1,ArrowRight:1,ArrowUp:-7,ArrowDown:7,Home:-value.getUTCDay(),End:6-value.getUTCDay()}[event.key];value.setUTCDate(value.getUTCDate()+offset);}
    if(value.getUTCFullYear()>=1900&&value.getUTCFullYear()<=9999){const next=value.toISOString().slice(0,10);dialog.dataset.month=next.slice(0,7);drawCalendar(dialog,next);}return;
   }
   if(event.key==='Escape'&&!s.busy&&s.stacks.financeiro.at(-1)==='conferir'){event.preventDefault();openForm();}
   if(event.key==='Enter'&&event.target.matches('input')&&s.stacks.financeiro.at(-1)==='registrar'){event.preventDefault();content.querySelector('[data-action=review]')?.click();}
  });
  back.addEventListener('click',()=>{if(s.busy)return;backMotion=true;if(s.stacks[s.area].length>1)s.stacks[s.area].pop();render();save(device);});
  const restore=saved=>{
   if(!saved||s.busy)return;
   if(areas[saved.area])s.area=saved.area;
   if(accounts.some(a=>a.id===saved.selected))s.selected=saved.selected;
   if(['all','open','partial','paid'].includes(saved.filter))s.filter=saved.filter;
   if(['today','week'].includes(saved.range))s.range=saved.range;
   if(Array.isArray(saved.payments)){
    const restored=[],used=new Set();
    for(const payment of saved.payments){const account=accounts.find(a=>a.id===payment.account);if(!account||typeof payment.id!=='string'||used.has(payment.id)||!Number.isSafeInteger(payment.amount)||payment.amount<=0||!validDate(payment.date)||!methods[payment.method])continue;const total=restored.filter(p=>p.account===account.id).reduce((sum,p)=>sum+p.amount,0);if(total+payment.amount>account.amount)continue;used.add(payment.id);restored.push({...payment,notes:typeof payment.notes==='string'?payment.notes:''});}
    s.payments=restored;
   }
   if(saved.draft&&Object.keys(blankDraft()).every(field=>typeof saved.draft[field]==='string')){Object.assign(s.draft,saved.draft);if(!['full','partial'].includes(s.draft.mode))s.draft.mode='full';}
   if(accounts.some(a=>a.id===saved.draftFor))s.draftFor=saved.draftFor;
   if(typeof saved.lastPayment==='string')s.lastPayment=saved.lastPayment;
   if(saved.stacks)for(const area of Object.keys(areas)){const stack=saved.stacks[area];if(Array.isArray(stack)&&stack.length&&stack.every(page=>typeof page==='string'&&(page==='resumo'||(area==='financeiro'&&['receber','registrar','conferir','conclusao','venda-origem'].includes(page))||children[area+':'+page])))s.stacks[area]=[...stack];}
   if(s.area==='financeiro'&&s.stacks.financeiro.at(-1)==='conferir'&&!validateDraft())s.stacks.financeiro[s.stacks.financeiro.length-1]='registrar';
   if(saved.design){if(['chat','light','dark'].includes(saved.design.appearance))s.design.appearance=saved.design.appearance;if(['normal','failure'].includes(saved.design.scenario))s.design.scenario=saved.design.scenario;if(['standard','reduced'].includes(saved.design.motion))s.design.motion=saved.design.motion;if(Number.isFinite(saved.design.radius))s.design.radius=Math.max(28,Math.min(40,saved.design.radius));}
   renderDesign();render();
  };
  s.restore=restore;const saved=window.openai?.widgetState?.privateContent;if(saved?.journeyVersion===4)restore(saved.devices?.[device]);renderDesign();render();
  if(globalThis.Tweak){const tweak=new Tweak({container:app,onChange:renderDesign});tweak.addSelect(s.design,'appearance',{label:'Aparência',options:[{label:'Seguir o chat',value:'chat'},{label:'Claro',value:'light'},{label:'Escuro',value:'dark'}]});tweak.addSlider(s.design,'radius',{label:'Arredondamento dos painéis',min:28,max:40,step:2,unit:'px'});tweak.addSelect(s.design,'motion',{label:'Movimento',options:[{label:'Padrão',value:'standard'},{label:'Reduzido',value:'reduced'}]});tweak.addSelect(s.design,'scenario',{label:'Próxima confirmação',options:[{label:'Registro normal',value:'normal'},{label:'Falha na primeira tentativa',value:'failure'}]});}
 }
 window.addEventListener('openai:set_globals',event=>{const saved=event.detail?.globals?.widgetState?.privateContent;if(saved?.journeyVersion===4)for(const [device,s] of Object.entries(states))s.restore(saved.devices?.[device]);});
})();
</script>
