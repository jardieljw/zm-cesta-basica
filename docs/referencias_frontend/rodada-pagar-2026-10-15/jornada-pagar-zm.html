  <button class="row cursor-interaction" type="button" data-go="mais:backup"><span class="row-icon"><i data-lucide="database-backup" aria-hidden="true"></i></span><span class="copy"><span class="title">Backup</span><span class="subtitle">Cópias de segurança e recuperação</span></span><i class="arrow" data-lucide="chevron-right" aria-hidden="true"></i></button>
 </div>

<script>
(() => {
 const root=document.getElementById('zm-payment-journey');
 const areas={inicio:'Visão geral',financeiro:'Financeiro',vendas:'Vendas',estoque:'Estoque',mais:'Mais'};
 const children={
  'financeiro:conta-fornecedor':{title:'Fornecedor de alimentos',label:'Valor a pagar',amount:'R$ 680,00',lines:[['Situação','Em aberto'],['Vencimento','16 de outubro'],['Origem','Compra de produtos'],['Forma prevista','Boleto']]},
  'financeiro:conta-embalagens':{title:'Fornecedor de embalagens',label:'Valor a pagar',amount:'R$ 600,00',lines:[['Situação','Em aberto'],['Vencimento','18 de outubro'],['Origem','Compra de embalagens']]},
  'financeiro:conta-ana':{title:'Ana Souza',label:'Saldo a receber',amount:'R$ 1.250,00',lines:[['Situação','Em aberto'],['Vencimento','17 de outubro'],['Origem','Venda de cestas']]},
  'financeiro:conta-bruno':{title:'Bruno Lima',label:'Saldo a receber',amount:'R$ 700,00',lines:[['Situação','Parcial'],['Vencimento','18 de outubro'],['Origem','Venda de cestas']]},
  'financeiro:contas':{title:'Contas e cartões',future:true,rows:[['Banco de exemplo','Conta da empresa · final 0821'],['Cartão de exemplo','Faturas e parcelas']]},
  'financeiro:documentos':{title:'Extratos e faturas',future:true,rows:[['Fatura de outubro','Cartão de exemplo · Em revisão'],['Extrato de outubro','Banco de exemplo · Conferido']]},
  'estoque:produtos':{title:'Produtos',rows:[['Arroz · pacote de 5 kg','12 pacotes disponíveis · Abaixo do mínimo'],['Óleo · frasco de 900 ml','36 frascos disponíveis'],['Café · pacote de 250 g','24 pacotes disponíveis']]},
  'estoque:compras':{title:'Compras',rows:[['Compra de alimentos','Fornecedor de alimentos · R$ 680,00'],['Compra de embalagens','Fornecedor de embalagens · R$ 600,00']]},
  'estoque:cestas':{title:'Cestas e montagens',rows:[['Cesta Básica Completa','Composição e montagens'],['Cesta de Carne','Composição e montagens']],basket:true},
  'estoque:movimentacoes':{title:'Movimentações',rows:[['Entrada de produtos','Compra confirmada'],['Montagem de 8 cestas','Consumo de produtos e entrada de cestas'],['Venda de 8 cestas','Saída de cestas prontas']]},
  'estoque:cesta-basica':{title:'Cesta Básica Completa',rows:[['Composição','Consultar produtos e quantidades'],['Registrar montagem','Padrão ou personalizada'],['Histórico de montagens','Registros anteriores']]},
  'vendas:clientes':{title:'Clientes',rows:[['Ana Souza','Cadastro e histórico financeiro'],['Bruno Lima','Cadastro e histórico financeiro']]},
  'vendas:venda':{title:'Detalhe da venda',label:'Total da venda',amount:'R$ 1.240,00',lines:[['Quantidade','8 cestas'],['Situação','Confirmada'],['Origem','Estoque de cestas prontas']]},
  'mais:relatorios':{title:'Relatórios',rows:[['Vendas por período','Consultar e exportar'],['Resumo financeiro','Consultar e exportar'],['Posição de estoque','Consultar e exportar']]},
  'mais:impressao':{title:'Impressão e formulários',rows:[['Relatório preenchido','Pré-visualizar, salvar PDF ou imprimir'],['Formulário em branco','Folha para preencher à caneta']]},
  'mais:configuracoes':{title:'Configurações e conexão',rows:[['Aparência','Tema, cores e acessibilidade'],['Conexão com o servidor','Disponibilidade e pareamento']]},
  'mais:backup':{title:'Backup',rows:[['Cópias de segurança','Consultar backups'],['Recuperação','Fluxo com revisão e confirmação']]}
 };
 const accounts=[{id:'fornecedor',name:'Fornecedor de alimentos',description:'Compra de produtos',amount:68000,due:'2026-10-16',planned:'Boleto'},{id:'embalagens',name:'Fornecedor de embalagens',description:'Compra de embalagens',amount:60000,due:'2026-10-18',planned:'Boleto'}];
 const methods={PIX:'Pix',BOLETO:'Boleto',DINHEIRO:'Dinheiro',CARTAO_CREDITO:'Cartão de crédito',TRANSFERENCIA:'Transferência',CHEQUE:'Cheque',OUTRO:'Outro'};
 const money=cents=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(cents/100);
 const moneyValue=cents=>new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(cents/100);
 const dateLabel=value=>{const [y,m,d]=value.split('-').map(Number);return new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(Date.UTC(y,m-1,d)));};
 const parseMoney=value=>{const clean=value.trim().replace(/^R\$\s*/, '');if(!/^(?:\d+|\d{1,3}(?:\.\d{3})+)(?:,\d{1,2})?$/.test(clean))return null;const [integer,fraction='']=clean.replaceAll('.','').split(',');const cents=Number(integer)*100+Number(fraction.padEnd(2,'0'));return Number.isSafeInteger(cents)?cents:null;};
 const validDate=value=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(value))return false;const [y,m,d]=value.split('-').map(Number);return y>=1900&&y<=9999&&new Date(Date.UTC(y,m-1,d)).toISOString().slice(0,10)===value;};
 const esc=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
 const blankDraft=()=>({amount:'',date:'2026-10-15',method:'',notes:''});
 const states={};
 const snapshot=()=>Object.fromEntries(Object.entries(states).map(([key,s])=>[key,{area:s.area,stacks:s.stacks,design:{...s.design},selected:s.selected,filter:s.filter,payments:s.payments,draft:s.draft,draftFor:s.draftFor,lastPayment:s.lastPayment}]));
 const save=device=>{if(window.openai?.setWidgetState){const s=states[device];const privateContent={journeyVersion:1,devices:snapshot()};window.openai.setWidgetState({modelContent:{prototype:'Jornada Pagar ZM',device,area:s.area,page:s.stacks[s.area].at(-1),selectedAccount:s.selected,payments:s.payments.map(p=>({account:p.account,amountCents:p.amount,method:p.method,date:p.date})),productionImplementation:false},privateContent:JSON.stringify(privateContent).length<14000?privateContent:null}).catch(()=>{});}};
 const icon=name=>{const el=document.createElement('i');el.dataset.lucide=name;el.setAttribute('aria-hidden','true');return el;};
 const make=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;};
 for(const app of root.querySelectorAll('.app')) {
  const device=app.dataset.device;
  app.appendChild(document.getElementById('zm-payment-shell').content.cloneNode(true));
  const s={area:'financeiro',stacks:Object.fromEntries(Object.keys(areas).map(key=>[key,key==='financeiro'?['resumo','pagar']:['resumo']])),design:{appearance:'chat',radius:18,scenario:'normal'},selected:'fornecedor',filter:'all',payments:[],draft:blankDraft(),draftFor:null,lastPayment:null,busy:false,errors:{},serviceError:false,failedOnce:false};states[device]=s;
  const content=app.querySelector('.content-inner'),title=app.querySelector('.page-title'),back=app.querySelector('.back');
  const renderDesign=()=>{app.style.colorScheme=s.design.appearance==='chat'?'light dark':s.design.appearance;app.style.setProperty('--radius',s.design.radius+'px');};
  const navigate=(area,page='resumo')=>{s.area=area;if(s.stacks[area].at(-1)!==page)s.stacks[area].push(page);render();save(device);};
  const current=()=>accounts.find(account=>account.id===s.selected)||accounts[0];
  const paid=account=>s.payments.filter(p=>p.account===account.id).reduce((total,p)=>total+p.amount,0);
  const balance=account=>account.amount-paid(account);
  const situation=account=>balance(account)===0?'paid':paid(account)>0?'partial':'open';
  const statusText=account=>({paid:'Paga',partial:'Parcial',open:'Em aberto'}[situation(account)]);
  const totalBalance=()=>accounts.reduce((total,a)=>total+balance(a),0);
  const accountPage=()=>`conta-${s.selected}`;
  function detailBox(lines) {return `<section class="details">${lines.map(([label,value])=>`<div class="detail-line"><span>${esc(label)}</span><span>${esc(value)}</span></div>`).join('')}</section>`;}
  function accountHero(account) {return `<section class="hero finance"><div class="account-heading"><span class="label">Saldo em aberto</span><span class="tag ${situation(account)==='paid'?'paid-tag':''}">${statusText(account)}</span></div><div class="detail-amount" data-balance>${money(balance(account))}</div><div class="summary-pair"><div><span class="label">Valor original</span><strong>${money(account.amount)}</strong></div><div><span class="label">Já pago</span><strong>${money(paid(account))}</strong></div></div></section>`;}
  function history(account) {
   const payments=s.payments.filter(p=>p.account===account.id);
   return `<section class="details"><div class="section-header"><h3>Histórico</h3><small>${payments.length} ${payments.length===1?'pagamento':'pagamentos'}</small></div><div class="history">${payments.slice().reverse().map(payment=>`<div class="history-entry"><div><span>Pagamento registrado</span><strong>${money(payment.amount)}</strong></div><p>${dateLabel(payment.date)} · ${methods[payment.method]}</p>${payment.notes?`<p>${esc(payment.notes)}</p>`:''}</div>`).join('')}<div class="history-entry"><div><span>Conta criada</span><strong>${money(account.amount)}</strong></div><p>14 de outubro de 2026 · ${account.description}</p></div></div></section>`;
  }
  function workspace(mainHtml) {
   content.innerHTML=`<div class="detail-workspace"><aside class="account-context" aria-label="Contas desta semana"><p class="label">Nesta semana</p>${accounts.map(account=>`<button type="button" class="context-account cursor-interaction" data-go="financeiro:conta-${account.id}" aria-current="${account.id===s.selected}">${esc(account.name)}<span>${money(balance(account))} em aberto</span></button>`).join('')}</aside><div class="account-main">${mainHtml}</div></div>`;
  }
  function renderAccount() {
   const account=current();title.textContent=account.name;
   workspace(`<p class="context">Financeiro / Pagar</p>${accountHero(account)}${detailBox([['Vencimento',dateLabel(account.due)],['Origem',account.description],['Forma prevista',account.planned]])}${history(account)}`);
   if(balance(account)>0)content.insertAdjacentHTML('beforeend','<button type="button" class="primary floating-action cursor-interaction" data-action="register"><i data-lucide="plus" aria-hidden="true"></i>Registrar pagamento</button>');
  }
  function errorSummary() {
   const errors=Object.entries(s.errors);return errors.length?`<aside class="error-box" role="alert"><h3>Confira os campos</h3><ul>${errors.map(([field,message])=>`<li><button type="button" class="cursor-interaction" data-focus="${field}">${esc(message)}</button></li>`).join('')}</ul></aside>`:'';
  }
  function errorField(field) {return s.errors[field]?`<span class="field-error" id="${device}-${field}-error">${esc(s.errors[field])}</span>`:'';}
  function inputAttrs(field) {return `id="${device}-${field}" data-field="${field}" ${s.errors[field]?`aria-invalid="true" aria-describedby="${device}-${field}-error"`:''}`;}
  function renderForm() {
   const account=current();title.textContent='Registrar pagamento';const cents=parseMoney(s.draft.amount);
   workspace(`<p class="context">${esc(account.name)}</p><div class="entry-summary"><span>Em aberto</span><strong>${money(balance(account))}</strong></div>${errorSummary()}<section class="form-panel" aria-label="Dados do pagamento"><div class="field"><label for="${device}-amount">Quanto você pagou?</label><div class="money-entry"><span aria-hidden="true">R$</span><input type="text" inputmode="decimal" autocomplete="off" ${inputAttrs('amount')} value="${esc(s.draft.amount)}" placeholder="0,00" aria-label="Quanto você pagou?"></div>${errorField('amount')}<span class="helper">Até ${money(balance(account))}. Pode ser um pagamento parcial.</span></div><div class="form-pair"><div class="field"><label for="${device}-date">Data do pagamento</label><input type="date" ${inputAttrs('date')} value="${esc(s.draft.date)}">${errorField('date')}</div><div class="field"><label for="${device}-method">Como você pagou?</label><select class="cursor-interaction" ${inputAttrs('method')}><option value="">Selecione</option>${Object.entries(methods).map(([value,label])=>`<option value="${value}" ${s.draft.method===value?'selected':''}>${label}</option>`).join('')}</select>${errorField('method')}</div></div><div class="field"><label for="${device}-notes">Observação <span class="helper">(opcional)</span></label><textarea rows="2" ${inputAttrs('notes')} placeholder="Uma referência para consultar depois">${esc(s.draft.notes)}</textarea></div><div class="entry-summary"><span>Restará em aberto</span><strong data-remaining>${cents!==null&&cents>0&&cents<=balance(account)?money(balance(account)-cents):'—'}</strong></div><button class="primary cursor-interaction" type="button" data-action="review">Revisar pagamento<i data-lucide="arrow-right" aria-hidden="true"></i></button></section><p class="note">Registre um pagamento que você já realizou.</p>`);
  }
  function validateDraft() {
   const errors={},cents=parseMoney(s.draft.amount),account=current();
   if(cents===null)errors.amount='Informe um valor válido, como 300,00.';
   else if(cents<=0)errors.amount='Informe um valor maior que zero.';
   else if(cents>balance(account))errors.amount=`Informe até ${money(balance(account))}, o saldo em aberto.`;
   if(!validDate(s.draft.date))errors.date='Selecione a data do pagamento.';
   if(!methods[s.draft.method])errors.method='Selecione como você pagou.';
   s.errors=errors;return Object.keys(errors).length===0;
  }
  function refreshFieldError(field) {
   if(!s.errors[field])return;
   const previous={...s.errors};validateDraft();const message=s.errors[field];s.errors=previous;
   const input=content.querySelector(`[data-field="${field}"]`),error=content.querySelector(`#${device}-${field}-error`);
   if(message){s.errors[field]=message;if(error)error.textContent=message;}
   else{delete s.errors[field];input?.removeAttribute('aria-invalid');input?.removeAttribute('aria-describedby');error?.remove();}
   const summary=content.querySelector('.error-box');if(summary){const html=errorSummary();if(html)summary.outerHTML=html;else summary.remove();}
  }
  function renderReview() {
   const account=current(),cents=parseMoney(s.draft.amount);title.textContent='Conferir pagamento';
   const rows=[['Valor pago',money(cents),'amount'],['Data do pagamento',dateLabel(s.draft.date),'date'],['Forma de pagamento',methods[s.draft.method],'method'],['Observação',s.draft.notes.trim()||'Não informada','notes']];
   workspace(`<p class="context">${esc(account.name)}</p>${s.serviceError?'<aside class="error-box" role="alert"><h3>Não foi possível registrar</h3><p>O registro não foi salvo. Seus dados foram mantidos para tentar novamente.</p></aside>':''}<section class="form-panel"><div><h3>Confira antes de registrar</h3><p class="helper" style="margin-top:8px">O registro será salvo quando você confirmar.</p></div><dl class="review-list">${rows.map(([label,value,field])=>`<div class="review-line"><div><dt>${label}</dt><dd>${esc(value)}</dd></div><button type="button" class="edit-value cursor-interaction" data-edit="${field}" ${s.busy?'disabled':''} aria-label="Alterar ${label.toLowerCase()}">Alterar</button></div>`).join('')}</dl><div class="entry-summary"><span>Restará em aberto</span><strong>${money(balance(account)-cents)}</strong></div><button type="button" class="primary cursor-interaction" data-action="confirm" ${s.busy?'disabled':''}>${s.busy?'<i class="busy-icon" data-lucide="loader-circle" aria-hidden="true"></i>Registrando…':'Confirmar registro'}</button><button type="button" class="secondary cursor-interaction" data-action="edit" ${s.busy?'disabled':''}>Voltar aos dados</button></section><p class="note" role="status" aria-live="polite">${s.busy?'Registrando o pagamento…':'Você está registrando um pagamento já realizado.'}</p>`);
  }
  function renderSuccess() {
   const account=current(),payment=s.payments.find(p=>p.id===s.lastPayment);title.textContent='Pagamento registrado';
   if(!payment){s.stacks.financeiro=['resumo','pagar',accountPage()];renderAccount();return;}
   workspace(`<p class="context">${esc(account.name)}</p><section class="success-panel"><div class="success-mark"><i data-lucide="check" aria-hidden="true"></i></div><h3>Pagamento registrado</h3><p class="note" role="status" aria-live="polite">${money(payment.amount)} registrados em ${dateLabel(payment.date)}, por ${methods[payment.method]}.</p><div class="entry-summary"><span>${balance(account)===0?'Conta quitada':'Restante em aberto'}</span><strong>${money(balance(account))}</strong></div><button type="button" class="primary cursor-interaction" data-action="view-account">Ver conta e histórico<i data-lucide="arrow-right" aria-hidden="true"></i></button><button type="button" class="secondary cursor-interaction" data-action="list">Voltar para Pagar</button></section>`);
  }
  function renderPayables(target) {
   const filtered=accounts.filter(a=>s.filter==='all'||situation(a)===s.filter);
   target.innerHTML=`<section class="list-total"><span class="label">Saldo em aberto no período</span><strong class="amount" data-total>${money(totalBalance())}</strong><span class="helper">12 a 18 de outubro · Todas as contas do período</span></section><div class="list-filter"><label for="${device}-status">Situação</label><select class="cursor-interaction" id="${device}-status" data-filter><option value="all">Todas</option><option value="open">Em aberto</option><option value="partial">Parcial</option><option value="paid">Pagas</option></select></div><section><div class="section-header"><h3>Contas da semana</h3><small>${filtered.length} de ${accounts.length}</small></div><div class="rows">${filtered.map(account=>`<button class="row cursor-interaction" type="button" data-go="financeiro:conta-${account.id}"><span class="copy"><span class="title">${esc(account.name)}</span><span class="subtitle">${account.description} · ${account.due.slice(8)} out.</span><span class="tag ${situation(account)==='paid'?'paid-tag':''}">${statusText(account)}</span></span><span class="value">${balance(account)===0?'Quitada':money(balance(account))}</span><i class="arrow" data-lucide="chevron-right" aria-hidden="true"></i></button>`).join('')||'<p class="result-message">Nenhuma conta nesta situação. Você pode escolher outra situação.</p>'}</div></section>`;
   target.querySelector('[data-filter]').value=s.filter;
  }
  function updateAmounts() {
   const amounts=content.querySelectorAll('.hero.finance .amount');if(s.area==='inicio'&&amounts[0])amounts[0].textContent=money(totalBalance());
   if(s.area==='inicio'){const pending=accounts.filter(account=>balance(account)>0).length,attention=content.querySelector('[data-go="financeiro:pagar"]');if(attention){attention.querySelector('.title').textContent=pending?`${pending} ${pending===1?'conta a pagar':'contas a pagar'}`:'Contas da semana em dia';attention.querySelector('.subtitle').textContent=pending?'Vencem nesta semana':'Consultar os registros da semana';}}
   if(s.area==='financeiro'&&s.stacks.financeiro.at(-1)==='resumo'){const first=content.querySelector('.finance-content .amount');if(first)first.textContent=money(totalBalance());}
  }
  function renderDetail(data) {
   if(data.future){const status=make('p','context','Exemplo de uma função planejada');content.appendChild(status);}
   if(data.amount){const hero=make('section','hero');hero.append(make('span','label',data.label),make('div','detail-amount',data.amount));content.appendChild(hero);}
   if(data.lines){const box=make('section','details');for(const [label,value] of data.lines){const row=make('div','detail-line');row.append(make('span','',label),make('span','',value));box.appendChild(row);}content.appendChild(box);}
   if(data.rows){const rows=make('div','rows');data.rows.forEach(([name,description],index)=>{
    const row=make(data.basket&&index===0?'button':'div','row'+(data.basket&&index===0?' cursor-interaction':''));
    const copy=make('span','copy');copy.append(make('span','title',name),make('span','subtitle',description));row.appendChild(copy);
    if(data.basket&&index===0){row.type='button';row.dataset.go='estoque:cesta-basica';const arrow=icon('chevron-right');arrow.className='arrow';row.appendChild(arrow);}rows.appendChild(row);
   });content.appendChild(rows);}
   const note=make('p','note','Dados ilustrativos. Esta prévia mostra onde encontrar as informações.');content.appendChild(note);
  }
  function render() {
   const page=s.stacks[s.area].at(-1),key=s.area+':'+page;
   content.replaceChildren();back.hidden=s.stacks[s.area].length<=1;
   app.querySelectorAll('[data-area]').forEach(button=>{if(button.dataset.area===s.area)button.setAttribute('aria-current','page');else button.removeAttribute('aria-current');});
   if(s.area==='financeiro'&&['conta-fornecedor','conta-embalagens','registrar','conferir','conclusao'].includes(page)){
    if(page.startsWith('conta-')){s.selected=page.slice(6);renderAccount();}
    else if(page==='registrar')renderForm();
    else if(page==='conferir')renderReview();
    else renderSuccess();
   }
   else if(children[key]){title.textContent=children[key].title;content.appendChild(make('p','context',areas[s.area]));renderDetail(children[key]);}
   else if(s.area==='financeiro'){
    title.textContent='Financeiro';content.appendChild(document.getElementById('zm-pay-financeiro').content.cloneNode(true));
    const tab=['resumo','pagar','receber'].includes(page)?page:'resumo';
    content.querySelectorAll('[data-finance]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.finance===tab)));
    const target=content.querySelector('.finance-content');target.style.display='grid';target.style.gap='20px';target.appendChild(document.getElementById(tab==='resumo'?'zm-pay-financeiro-resumo':'zm-pay-'+tab).content.cloneNode(true));
    if(tab==='pagar')renderPayables(target);
   }else {title.textContent=areas[s.area];content.appendChild(document.getElementById('zm-pay-'+s.area).content.cloneNode(true));}
   updateAmounts();
   for(const button of app.querySelectorAll('.navigation button,.back,.restart'))button.disabled=s.busy;
   content.setAttribute('aria-busy',String(s.busy));
   if(globalThis.lucide)lucide.createIcons({attrs:{width:18,height:18}});
  }
  function openForm(field) {
   if(s.draftFor!==s.selected){s.draft=blankDraft();s.draftFor=s.selected;}
   s.errors={};s.serviceError=false;
   if(s.stacks.financeiro.at(-1)==='conferir')s.stacks.financeiro.pop();
   navigate('financeiro','registrar');
   if(field)content.querySelector(`[data-field="${field}"]`)?.focus();
  }
  function confirmPayment() {
   if(s.busy||s.stacks.financeiro.at(-1)!=='conferir')return;
   if(!validateDraft()){s.stacks.financeiro[s.stacks.financeiro.length-1]='registrar';render();return;}
   s.busy=true;s.serviceError=false;render();
   setTimeout(()=>{
    s.busy=false;
    if(s.design.scenario==='failure'&&!s.failedOnce){s.failedOnce=true;s.serviceError=true;render();save(device);return;}
    const payment={id:`demo-${s.payments.length+1}`,account:s.selected,amount:parseMoney(s.draft.amount),date:s.draft.date,method:s.draft.method,notes:s.draft.notes.trim()};
    s.payments.push(payment);s.lastPayment=payment.id;s.draft=blankDraft();s.draftFor=null;
    s.stacks.financeiro=['resumo','pagar',accountPage(),'conclusao'];render();save(device);
   },850);
  }
  app.addEventListener('click',event=>{
   const button=event.target.closest('button');if(!button||!app.contains(button))return;
   if(s.busy)return;
   if(button.dataset.action){
    const action=button.dataset.action;
    if(action==='register'||action==='edit')openForm();
    else if(action==='review'){
     if(validateDraft()){s.draft.amount=moneyValue(parseMoney(s.draft.amount));s.serviceError=false;navigate('financeiro','conferir');}
     else{render();content.querySelector(`[data-field="${Object.keys(s.errors)[0]}"]`)?.focus();save(device);}
    }
    else if(action==='confirm')confirmPayment();
    else if(action==='view-account'){s.stacks.financeiro=['resumo','pagar',accountPage()];render();save(device);}
    else if(action==='list'){s.stacks.financeiro=['resumo','pagar'];render();save(device);}
    else if(action==='restart'){
     Object.assign(s,{area:'financeiro',selected:'fornecedor',filter:'all',payments:[],draft:blankDraft(),draftFor:null,lastPayment:null,errors:{},serviceError:false,failedOnce:false});
     s.stacks=Object.fromEntries(Object.keys(areas).map(area=>[area,area==='financeiro'?['resumo','pagar']:['resumo']]));render();save(device);
    }
   }
   else if(button.dataset.edit)openForm(button.dataset.edit);
   else if(button.dataset.focus)content.querySelector(`[data-field="${button.dataset.focus}"]`)?.focus();
   else if(button.dataset.area){s.area=button.dataset.area;render();save(device);}
   else if(button.dataset.go){const [area,page]=button.dataset.go.split(':');navigate(area,page);}
   else if(button.dataset.finance){s.stacks.financeiro=[...s.stacks.financeiro.slice(0,-1),button.dataset.finance];render();save(device);}
  });
  app.addEventListener('input',event=>{
   const field=event.target.dataset.field;if(!field||s.busy)return;
   s.draft[field]=event.target.value;
   if(field==='amount'){const cents=parseMoney(s.draft.amount),remaining=content.querySelector('[data-remaining]');if(remaining)remaining.textContent=cents!==null&&cents>0&&cents<=balance(current())?money(balance(current())-cents):'—';}
  });
  app.addEventListener('change',event=>{
   if(event.target.hasAttribute('data-filter')){s.filter=event.target.value;render();save(device);}
   else if(event.target.dataset.field){s.draft[event.target.dataset.field]=event.target.value;refreshFieldError(event.target.dataset.field);save(device);}
  });
  app.addEventListener('focusout',event=>{
   const field=event.target.dataset.field;if(!field)return;
   if(field==='amount'){const cents=parseMoney(s.draft.amount);if(cents!==null){s.draft.amount=moneyValue(cents);event.target.value=s.draft.amount;}}
   refreshFieldError(field);
   save(device);
  });
  app.addEventListener('keydown',event=>{
   if(event.key==='Escape'&&!s.busy&&s.stacks.financeiro.at(-1)==='conferir'){event.preventDefault();openForm();}
   if(event.key==='Enter'&&event.target.matches('input')&&s.stacks.financeiro.at(-1)==='registrar'){event.preventDefault();content.querySelector('[data-action=review]')?.click();}
  });
  back.addEventListener('click',()=>{if(s.busy)return;if(s.stacks[s.area].length>1)s.stacks[s.area].pop();render();save(device);});
  const restore=saved=>{
   if(!saved||s.busy)return;
   if(areas[saved.area])s.area=saved.area;
   if(accounts.some(a=>a.id===saved.selected))s.selected=saved.selected;
   if(['all','open','partial','paid'].includes(saved.filter))s.filter=saved.filter;
   if(Array.isArray(saved.payments)){
    const restored=[],used=new Set();
    for(const payment of saved.payments){const account=accounts.find(a=>a.id===payment.account);if(!account||typeof payment.id!=='string'||used.has(payment.id)||!Number.isSafeInteger(payment.amount)||payment.amount<=0||!validDate(payment.date)||!methods[payment.method])continue;const total=restored.filter(p=>p.account===account.id).reduce((sum,p)=>sum+p.amount,0);if(total+payment.amount>account.amount)continue;used.add(payment.id);restored.push({...payment,notes:typeof payment.notes==='string'?payment.notes:''});}
    s.payments=restored;
   }
   if(saved.draft&&Object.keys(blankDraft()).every(field=>typeof saved.draft[field]==='string'))Object.assign(s.draft,saved.draft);
   if(accounts.some(a=>a.id===saved.draftFor))s.draftFor=saved.draftFor;
   if(typeof saved.lastPayment==='string')s.lastPayment=saved.lastPayment;
   if(saved.stacks)for(const area of Object.keys(areas)){const stack=saved.stacks[area];if(Array.isArray(stack)&&stack.length&&stack.every(page=>typeof page==='string'&&(page==='resumo'||(area==='financeiro'&&['pagar','receber','registrar','conferir','conclusao'].includes(page))||children[area+':'+page])))s.stacks[area]=[...stack];}
   if(s.area==='financeiro'&&s.stacks.financeiro.at(-1)==='conferir'&&!validateDraft())s.stacks.financeiro[s.stacks.financeiro.length-1]='registrar';
   if(saved.design){if(['chat','light','dark'].includes(saved.design.appearance))s.design.appearance=saved.design.appearance;if(['normal','failure'].includes(saved.design.scenario))s.design.scenario=saved.design.scenario;}
   renderDesign();render();
  };
  s.restore=restore;const saved=window.openai?.widgetState?.privateContent;if(saved?.journeyVersion===1)restore(saved.devices?.[device]);renderDesign();render();
  if(globalThis.Tweak){const tweak=new Tweak({container:app,onChange:renderDesign});tweak.addSelect(s.design,'appearance',{label:'Aparência',options:[{label:'Seguir o chat',value:'chat'},{label:'Claro',value:'light'},{label:'Escuro',value:'dark'}]});tweak.addSelect(s.design,'scenario',{label:'Próxima confirmação',options:[{label:'Registro normal',value:'normal'},{label:'Falha na primeira tentativa',value:'failure'}]});}
 }
 window.addEventListener('openai:set_globals',event=>{const saved=event.detail?.globals?.widgetState?.privateContent;if(saved?.journeyVersion===1)for(const [device,s] of Object.entries(states))s.restore(saved.devices?.[device]);});
})();
</script>
