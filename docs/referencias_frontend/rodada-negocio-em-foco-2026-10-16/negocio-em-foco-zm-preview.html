&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );

  initialStateElement?.remove();

  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;

  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(

      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**

   * @param {string} property
   */

    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply

    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }

  };

  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);

  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;

  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };

    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }

      },
    );

      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }

      modelContent: null,
      privateContent: null,
      ...parsedState,

      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;

      new CustomEvent(&quot;openai:set_globals&quot;, {

    );

      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);

                } else {

                }

          },
        ]);

      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {

      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;

        id = decodeURIComponent(href.slice(1));

        return;
      }

        target == null ||
        globalThis.navigator.userActivation?.isActive !== true

        return;

        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });

    }

  });

  syncTheme();
})();

  function financeSummary(){title.textContent=&#x27;Financeiro&#x27;;return `&lt;p class=&quot;context&quot;&gt;Posição atual · 16 de outubro de 2026&lt;/p&gt;&lt;div class=&quot;money-pair&quot;&gt;&lt;section class=&quot;panel flow&quot;&gt;&lt;span class=&quot;overline&quot;&gt;Total pendente a pagar&lt;/span&gt;&lt;strong class=&quot;large num&quot;&gt;${money(total(selectedAccounts(&#x27;pay&#x27;,&#x27;open&#x27;)))}&lt;/strong&gt;${button(&#x27;Consultar contas&#x27;,&#x27;all-pay&#x27;,&#x27;inline-link&#x27;)}&lt;/section&gt;&lt;section class=&quot;panel flow&quot;&gt;&lt;span class=&quot;overline&quot;&gt;Total pendente a receber&lt;/span&gt;&lt;strong class=&quot;large num&quot;&gt;${money(total(selectedAccounts(&#x27;receive&#x27;,&#x27;open&#x27;)))}&lt;/strong&gt;${button(&#x27;Consultar recebimentos&#x27;,&#x27;all-receive&#x27;,&#x27;inline-link&#x27;)}&lt;/section&gt;&lt;/div&gt;&lt;section class=&quot;panel flow&quot;&gt;&lt;h3&gt;Vencimentos a pagar&lt;/h3&gt;&lt;div&gt;${financialLink(&#x27;today&#x27;,&#x27;Vencem hoje&#x27;)}${financialLink(&#x27;overdue&#x27;,&#x27;Contas vencidas&#x27;)}${financialLink(&#x27;next&#x27;,&#x27;Próximos 3 dias&#x27;)}&lt;/div&gt;&lt;/section&gt;&lt;p class=&quot;help&quot;&gt;Os valores são pendências cadastradas, e não saldo disponível em banco.&lt;/p&gt;${resultPanel()}`;}
  function list(){title.textContent=s.kind===&#x27;pay&#x27;?&#x27;Contas a Pagar&#x27;:&#x27;Contas a Receber&#x27;;const items=selectedAccounts(s.kind,s.filter);const rows=items.map(a=&gt;`&lt;button type=&quot;button&quot; class=&quot;list-row cursor-interaction&quot; data-action=&quot;account&quot; data-id=&quot;${a.id}&quot;&gt;&lt;span class=&quot;copy&quot;&gt;&lt;span class=&quot;name&quot;&gt;${esc(a.name)}&lt;/span&gt;&lt;span class=&quot;sub&quot;&gt;${a.kind===&#x27;pay&#x27;?&#x27;Conta&#x27;:&#x27;Venda&#x27;} #${a.number} · Vence ${shortDate(a.due)}&lt;/span&gt;&lt;span class=&quot;tag ${group(a)===&#x27;overdue&#x27;?&#x27;warn&#x27;:&#x27;&#x27;}&quot;&gt;${status(a)}${group(a)===&#x27;overdue&#x27;?&#x27; · Vencida&#x27;:&#x27;&#x27;}&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;row-value&quot;&gt;${money(balance(a))}&lt;/span&gt;&lt;span class=&quot;arrow&quot;&gt;${icon(&#x27;chevron-right&#x27;)}&lt;/span&gt;&lt;/button&gt;`).join(&#x27;&#x27;);return `&lt;div class=&quot;tabs&quot; aria-label=&quot;Área financeira&quot;&gt;${[&#x27;pay&#x27;,&#x27;receive&#x27;].map(k=&gt;button(k===&#x27;pay&#x27;?&#x27;Pagar&#x27;:&#x27;Receber&#x27;,&#x27;kind&#x27;,&#x27;&#x27;,`data-kind=&quot;${k}&quot; aria-pressed=&quot;${s.kind===k}&quot;`)).join(&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;filter-pills&quot; aria-label=&quot;Recorte de vencimento&quot;&gt;${[[&#x27;today&#x27;,&#x27;Hoje&#x27;],[&#x27;overdue&#x27;,&#x27;Vencidas&#x27;],[&#x27;next&#x27;,&#x27;Próximos 3 dias&#x27;],[&#x27;open&#x27;,&#x27;Todas abertas&#x27;]].map(([key,label])=&gt;button(label,&#x27;filter&#x27;,&#x27;&#x27;,`data-filter=&quot;${key}&quot; aria-pressed=&quot;${s.filter===key}&quot;`)).join(&#x27;&#x27;)}&lt;/div&gt;&lt;section class=&quot;panel flow&quot;&gt;&lt;p class=&quot;overline&quot;&gt;${groupLabel[s.filter]}&lt;/p&gt;&lt;strong class=&quot;large num&quot;&gt;${money(total(items))}&lt;/strong&gt;&lt;p class=&quot;help&quot;&gt;Saldo ${s.kind===&#x27;pay&#x27;?&#x27;a pagar&#x27;:&#x27;a receber&#x27;} · ${items.length} ${items.length===1?&#x27;registro&#x27;:&#x27;registros&#x27;} neste recorte&lt;/p&gt;&lt;/section&gt;${items.length?`&lt;section class=&quot;panel list&quot;&gt;&lt;div class=&quot;mobile-list&quot;&gt;${rows}&lt;/div&gt;&lt;table class=&quot;table&quot; aria-label=&quot;Contas do recorte&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;${s.kind===&#x27;pay&#x27;?&#x27;Beneficiário / conta&#x27;:&#x27;Cliente / venda&#x27;}&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Vencimento&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Situação&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Em aberto&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;${items.map(a=&gt;`&lt;tr&gt;&lt;td&gt;${button(esc(a.name),&#x27;account&#x27;,&#x27;&#x27;,`data-id=&quot;${a.id}&quot;`)}&lt;div class=&quot;help&quot;&gt;#${a.number}&lt;/div&gt;&lt;/td&gt;&lt;td&gt;${shortDate(a.due)}/2026&lt;/td&gt;&lt;td&gt;${status(a)}${group(a)===&#x27;overdue&#x27;?&#x27; · Vencida&#x27;:&#x27;&#x27;}&lt;/td&gt;&lt;td&gt;${money(balance(a))}&lt;/td&gt;&lt;/tr&gt;`).join(&#x27;&#x27;)}&lt;/tbody&gt;&lt;/table&gt;&lt;/section&gt;`:&#x27;&lt;section class=&quot;panel&quot;&gt;&lt;p role=&quot;status&quot;&gt;Nenhuma conta em aberto neste recorte. Você pode consultar outros vencimentos.&lt;/p&gt;&lt;/section&gt;&#x27;}`;}
  function detail(){const a=account();title.textContent=a.kind===&#x27;pay&#x27;?&#x27;Detalhe da conta&#x27;:&#x27;Detalhe do recebimento&#x27;;const history=payments.filter(p=&gt;p.account===a.id).slice().reverse();return `&lt;p class=&quot;context&quot;&gt;${a.kind===&#x27;pay&#x27;?&#x27;Conta&#x27;:&#x27;Venda&#x27;} #${a.number} · ${esc(a.description)}&lt;/p&gt;&lt;div class=&quot;form-width flow&quot;&gt;&lt;section class=&quot;panel flow&quot;&gt;&lt;h3&gt;${esc(a.name)}&lt;/h3&gt;&lt;div&gt;&lt;p class=&quot;overline&quot;&gt;Saldo em aberto&lt;/p&gt;&lt;strong class=&quot;large num&quot;&gt;${money(balance(a))}&lt;/strong&gt;&lt;/div&gt;&lt;p class=&quot;tag ${balance(a)===0?&#x27;ok&#x27;:group(a)===&#x27;overdue&#x27;?&#x27;warn&#x27;:&#x27;&#x27;}&quot;&gt;${status(a)}${balance(a)&gt;0&amp;&amp;group(a)===&#x27;overdue&#x27;?&#x27; · Vencida&#x27;:&#x27;&#x27;} · Vencimento ${shortDate(a.due)}/2026&lt;/p&gt;${ledger([[&#x27;Valor original&#x27;,money(a.original)],[a.kind===&#x27;pay&#x27;?&#x27;Já pago&#x27;:&#x27;Já recebido&#x27;,money(paid(a))]])}${balance(a)&gt;0?button(`Registrar ${noun()} ${icon(&#x27;arrow-right&#x27;)}`,&#x27;form&#x27;):&#x27;&#x27;}&lt;/section&gt;&lt;section class=&quot;panel flow&quot;&gt;&lt;h3&gt;Histórico ${a.kind===&#x27;pay&#x27;?&#x27;de pagamentos&#x27;:&#x27;de recebimentos&#x27;}&lt;/h3&gt;${history.map(p=&gt;ledger([[dateLabel(p.date),money(p.amount)],[&#x27;Forma&#x27;,methods[a.kind][p.method]]])).join(&#x27;&#x27;)}${a.initialPaid?ledger([[&#x27;Registro anterior&#x27;,money(a.initialPaid)]]) : !history.length?&#x27;&lt;p class=&quot;help&quot;&gt;Nenhum registro anterior nesta conta.&lt;/p&gt;&#x27;:&#x27;&#x27;}&lt;/section&gt;&lt;/div&gt;`;}
  function error(field){return s.errors[field]?`&lt;span class=&quot;error&quot; id=&quot;${device}-${field}-error&quot;&gt;${esc(s.errors[field])}&lt;/span&gt;`:&#x27;&#x27;;}

  function dateField(){return `&lt;div class=&quot;field&quot;&gt;&lt;label id=&quot;${device}-date-label&quot; for=&quot;${device}-date&quot;&gt;Data do ${noun()}&lt;/label&gt;&lt;button type=&quot;button&quot; class=&quot;date-trigger cursor-interaction&quot; data-action=&quot;calendar&quot; ${attrs(&#x27;date&#x27;)} aria-labelledby=&quot;${device}-date-label ${device}-date-value&quot; aria-expanded=&quot;false&quot; aria-controls=&quot;${device}-calendar&quot;&gt;&lt;span id=&quot;${device}-date-value&quot;&gt;${dateLabel(s.draft.date)}&lt;/span&gt;${icon(&#x27;calendar-days&#x27;)}&lt;/button&gt;${error(&#x27;date&#x27;)}&lt;dialog class=&quot;calendar&quot; id=&quot;${device}-calendar&quot; aria-labelledby=&quot;${device}-calendar-heading&quot;&gt;&lt;div class=&quot;cal-top&quot;&gt;&lt;h3 id=&quot;${device}-calendar-heading&quot;&gt;Data do ${noun()}&lt;/h3&gt;${button(icon(&#x27;x&#x27;),&#x27;calendar-close&#x27;,&#x27;&#x27;,`aria-label=&quot;Fechar calendário&quot;`)}&lt;/div&gt;&lt;div class=&quot;cal-month&quot;&gt;${button(icon(&#x27;chevron-left&#x27;),&#x27;calendar-month&#x27;,&#x27;&#x27;,`data-step=&quot;-1&quot; aria-label=&quot;Mês anterior&quot;`)}&lt;strong data-calendar-period&gt;&lt;/strong&gt;${button(icon(&#x27;chevron-right&#x27;),&#x27;calendar-month&#x27;,&#x27;&#x27;,`data-step=&quot;1&quot; aria-label=&quot;Próximo mês&quot;`)}&lt;/div&gt;&lt;div class=&quot;week&quot; aria-hidden=&quot;true&quot;&gt;${[&#x27;D&#x27;,&#x27;S&#x27;,&#x27;T&#x27;,&#x27;Q&#x27;,&#x27;Q&#x27;,&#x27;S&#x27;,&#x27;S&#x27;].map(day=&gt;`&lt;span&gt;${day}&lt;/span&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;days&quot; role=&quot;group&quot; aria-label=&quot;Dias do mês&quot;&gt;&lt;/div&gt;&lt;div class=&quot;cal-foot&quot;&gt;${button(&#x27;Hoje&#x27;,&#x27;calendar-today&#x27;,&#x27;&#x27;)}${button(&#x27;Cancelar&#x27;,&#x27;calendar-close&#x27;,&#x27;&#x27;)}&lt;/div&gt;&lt;/dialog&gt;&lt;/div&gt;`;}
  function form(){const a=account();title.textContent=`Registrar ${noun()}`;return `&lt;p class=&quot;context&quot;&gt;${esc(a.name)}&lt;/p&gt;&lt;div class=&quot;form-width flow&quot;&gt;&lt;section class=&quot;panel money-pair&quot;&gt;&lt;div&gt;&lt;span class=&quot;overline&quot;&gt;Saldo em aberto&lt;/span&gt;&lt;strong class=&quot;large num&quot;&gt;${money(balance(a))}&lt;/strong&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;panel flow&quot;&gt;&lt;p class=&quot;error-summary&quot; role=&quot;alert&quot; ${Object.keys(s.errors).length?&#x27;&#x27;:&#x27;hidden&#x27;}&gt;Confira os campos indicados para continuar.&lt;/p&gt;&lt;fieldset&gt;&lt;legend&gt;Tipo de ${noun()}&lt;/legend&gt;&lt;div class=&quot;choice&quot;&gt;${[[&#x27;full&#x27;,&#x27;Integral&#x27;],[&#x27;partial&#x27;,&#x27;Parcial&#x27;]].map(([value,label])=&gt;`&lt;label class=&quot;cursor-interaction&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;${device}-mode&quot; data-mode value=&quot;${value}&quot; ${s.draft.mode===value?&#x27;checked&#x27;:&#x27;&#x27;}&gt;&lt;span&gt;${label}&lt;/span&gt;&lt;/label&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;p class=&quot;help&quot; data-mode-help&gt;${s.draft.mode===&#x27;full&#x27;?`Valor integral definido: ${money(balance(a))}.`:&#x27;Informe apenas o valor pago ou recebido.&#x27;}&lt;/p&gt;&lt;div class=&quot;reveal&quot; data-open=&quot;${s.draft.mode===&#x27;partial&#x27;}&quot; ${s.draft.mode===&#x27;full&#x27;?&#x27;inert&#x27;:&#x27;&#x27;}&gt;&lt;div class=&quot;reveal-inner&quot;&gt;&lt;div class=&quot;field&quot;&gt;&lt;label for=&quot;${device}-amount&quot;&gt;${a.kind===&#x27;pay&#x27;?&#x27;Quanto você pagou?&#x27;:&#x27;Quanto você recebeu?&#x27;}&lt;/label&gt;&lt;input type=&quot;text&quot; inputmode=&quot;decimal&quot; placeholder=&quot;R$ 0,00&quot; value=&quot;${esc(s.draft.amount)}&quot; ${attrs(&#x27;amount&#x27;)} ${s.draft.mode===&#x27;full&#x27;?&#x27;disabled&#x27;:&#x27;&#x27;}&gt;&lt;span class=&quot;help&quot;&gt;Até ${money(balance(a))}.&lt;/span&gt;${error(&#x27;amount&#x27;)}&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/fieldset&gt;${dateField()}&lt;div class=&quot;field&quot;&gt;&lt;label for=&quot;${device}-method&quot;&gt;${a.kind===&#x27;pay&#x27;?&#x27;Como você pagou?&#x27;:&#x27;Como você recebeu?&#x27;}&lt;/label&gt;&lt;select ${attrs(&#x27;method&#x27;)}&gt;&lt;option value=&quot;&quot;&gt;Selecione&lt;/option&gt;${Object.entries(methods[a.kind]).map(([key,label])=&gt;`&lt;option value=&quot;${key}&quot; ${s.draft.method===key?&#x27;selected&#x27;:&#x27;&#x27;}&gt;${label}&lt;/option&gt;`).join(&#x27;&#x27;)}&lt;/select&gt;${error(&#x27;method&#x27;)}&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;label for=&quot;${device}-notes&quot;&gt;Observação &lt;span class=&quot;help&quot;&gt;(opcional)&lt;/span&gt;&lt;/label&gt;&lt;textarea rows=&quot;2&quot; maxlength=&quot;300&quot; ${attrs(&#x27;notes&#x27;)} placeholder=&quot;Uma referência para consultar depois&quot;&gt;${esc(s.draft.notes)}&lt;/textarea&gt;&lt;/div&gt;&lt;div class=&quot;note&quot;&gt;&lt;span&gt;Restará em aberto&lt;/span&gt;&lt;strong class=&quot;num&quot; data-remaining&gt;&lt;/strong&gt;&lt;/div&gt;${button(`Revisar ${noun()} ${icon(&#x27;arrow-right&#x27;)}`,&#x27;review&#x27;)}&lt;/section&gt;&lt;p class=&quot;help&quot;&gt;Registre um ${noun()} que você já realizou.&lt;/p&gt;&lt;/div&gt;`;}
  const amount=()=&gt;s.draft.mode===&#x27;full&#x27;?balance(account()):parseMoney(s.draft.amount);
  function updateRemaining(){const el=content.querySelector(&#x27;[data-remaining]&#x27;);if(!el)return;const value=amount();el.textContent=value!==null&amp;&amp;value&gt;0&amp;&amp;value&lt;=balance(account())?money(balance(account())-value):&#x27;—&#x27;;}
  function updateMode(){const partial=s.draft.mode===&#x27;partial&#x27;,reveal=content.querySelector(&#x27;.reveal&#x27;);reveal.dataset.open=String(partial);reveal.inert=!partial;const input=reveal.querySelector(&#x27;input&#x27;);input.disabled=!partial;if(!partial){delete s.errors.amount;input.removeAttribute(&#x27;aria-invalid&#x27;);content.querySelector(`#${device}-amount-error`)?.remove();}content.querySelector(&#x27;[data-mode-help]&#x27;).textContent=partial?&#x27;Informe apenas o valor pago ou recebido.&#x27;:`Valor integral definido: ${money(balance(account()))}.`;updateRemaining();}
  function validate(){s.errors={};const value=amount();if(s.draft.mode===&#x27;partial&#x27;&amp;&amp;(value===null||value&lt;=0||value&gt;balance(account())))s.errors.amount=`Informe um valor maior que zero, até ${money(balance(account()))}.`;if(!validDate(s.draft.date))s.errors.date=&#x27;Selecione uma data válida.&#x27;;if(!methods[account().kind][s.draft.method])s.errors.method=&#x27;Selecione a forma utilizada.&#x27;;return !Object.keys(s.errors).length&amp;&amp;value&gt;0;}

    const probeKey = `${storageKey}:probe`;
    localStorage.setItem(probeKey, "1");
    localStorage.removeItem(probeKey);
    storage = localStorage;
    const savedState = storage.getItem(storageKey);
    if (savedState != null) {
      try {
        state = parseState(savedState);
      } catch {
        // Invalid saved state does not disable future writes.
      }
    }
  } catch {
    storage = null;
  }
  const persistSize = () => {
    globalThis.clearTimeout(sizeWriteTimeout);
    if (pendingSize == null) {
      return;
    }
    try {
      storage?.setItem(sizeStorageKey, pendingSize);
    } catch {
      // A denied or full cache must not affect the visualization.
    }
    pendingSize = null;
  };
  if (isShare) {
    globalThis.addEventListener("pagehide", persistSize);
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height !== "number" ||
        !Number.isFinite(height) ||
        height < 0
      ) {
        return;
      }
      if (height <= 10_000) {
        const width = isShare && storage != null ? frame.clientWidth : null;
        frame.style.height = Math.ceil(height) + "px";
        if (isShare && storage != null) {
          const size = JSON.stringify({
            fingerprint: sizeFingerprint,
            width,
            viewportHeight: globalThis.innerHeight,
            dark: globalThis.matchMedia("(prefers-color-scheme: dark)").matches,
            scale: globalThis.devicePixelRatio,
            height: Math.ceil(height),
          });
          if (size !== lastSize) {
            lastSize = size;
            pendingSize = size;
            globalThis.clearTimeout(sizeWriteTimeout);
            sizeWriteTimeout = globalThis.setTimeout(persistSize, 100);
          }
        }
      }
      if (isShare) {
        // Keep unusually tall content accessible without accepting an unbounded height.
        if (height > 10_000 && Number.parseFloat(frame.style.height) === 0) {
          frame.style.removeProperty("height");
        }
        frame.scrolling = height > 10_000 ? "auto" : "no";
        document.documentElement.classList.add("visualization-share-ready");
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!isShare && (!Number.isFinite(height) || height <= viewportHeight)) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  const frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  if (isShare && storage != null) {
    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;
    }
    sizeFingerprint = hash.toString(36);
    try {
      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");
      if (
        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&
        size.scale === globalThis.devicePixelRatio &&
        typeof size.height === "number" &&
        Number.isFinite(size.height) &&
        size.height >= 0 &&
        size.height <= 10_000
      ) {
        frame.style.height = size.height + "px";
      }
    } catch {
      // Ignore missing or invalid cache entries and measure the live frame.
    }
  }
  frame.srcdoc = frameHtml;
  delete frame.dataset.srcdoc;
})();
</script>
</body>
</html>
