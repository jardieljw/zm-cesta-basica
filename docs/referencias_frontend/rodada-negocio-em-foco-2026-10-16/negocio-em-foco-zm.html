   if(action==='sales-today'){go('sales-day',{area:'vendas'});return;}
   if(action==='financial'){go('list',{area:'financeiro',kind:'pay',filter:b.dataset.filter});return;}
   if(action==='finance-summary'){go('finance',{area:'financeiro'});return;}
   if(action==='all-pay'||action==='all-receive'){go('list',{area:'financeiro',kind:action==='all-pay'?'pay':'receive',filter:'open'});return;}
   if(action==='filter'){s.filter=b.dataset.filter;render();save();return;}if(action==='kind'){s.kind=b.dataset.kind;render();save();return;}
   if(action==='account'){go('detail',{selected:b.dataset.id});return;}
   if(action==='stock'){go('stock',{area:'estoque',stockOnly:true});return;}if(action==='stock-filter'){s.stockOnly=b.dataset.value==='low';render();save();return;}
   if(action==='explanation'){go('explanation');return;}
   if(action==='form'){if(s.draftFor!==s.selected){s.draft=blankDraft();s.draftFor=s.selected;}go('form');return;}
   if(action==='review'){if(validate()){s.review={amount:amount(),balance:balance(account())};go('review');}else{render();content.querySelector(`[data-field="${Object.keys(s.errors)[0]}"]`)?.focus();}return;}
   if(action==='edit'){back();return;}if(action==='confirm'){confirm();return;}
   if(action==='confirmed-detail'){if(s.history.at(-1)?.page==='detail')s.history.pop();s.page='detail';render();transition();save();return;}if(action==='return-list'){s.history=s.history.filter(v=>!['form','review','detail','success'].includes(v.page));if(s.history.at(-1)?.page==='list')s.history.pop();s.page='list';s.area='financeiro';render();transition();save();return;}
   if(action==='calendar'){openCalendar();return;}if(action==='calendar-close'){content.querySelector('.calendar').close();return;}if(action==='calendar-today'){chooseDate('2026-10-16');return;}if(action==='calendar-date'){chooseDate(b.dataset.date);return;}
   if(action==='calendar-month'){const dialog=content.querySelector('.calendar'),[y,m]=dialog.dataset.month.split('-').map(Number);dialog.dataset.month=new Date(Date.UTC(y,m-1+Number(b.dataset.step),1)).toISOString().slice(0,7);drawCalendar(dialog);return;}
  });
  app.addEventListener('input',event=>{const field=event.target.dataset.field;if(field&&['amount','notes'].includes(field)){s.draft[field]=event.target.value;updateRemaining();}if(event.target.dataset.pref==='accent'){design.accent=event.target.value;applyDesign();}});
  app.addEventListener('change',event=>{if(event.target.hasAttribute('data-mode')){s.draft.mode=event.target.value;updateMode();save();return;}const field=event.target.dataset.field;if(field&&field in s.draft){s.draft[field]=event.target.value;save();}const pref=event.target.dataset.pref;if(pref&&pref in design){design[pref]=event.target.value;applyDesign();save();}});
  content.addEventListener('keydown',event=>{const value=event.target.dataset.date;if(!value||!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End','PageUp','PageDown'].includes(event.key))return;event.preventDefault();const date=new Date(value+'T00:00:00Z');if(event.key==='ArrowLeft')date.setUTCDate(date.getUTCDate()-1);if(event.key==='ArrowRight')date.setUTCDate(date.getUTCDate()+1);if(event.key==='ArrowUp')date.setUTCDate(date.getUTCDate()-7);if(event.key==='ArrowDown')date.setUTCDate(date.getUTCDate()+7);if(event.key==='Home')date.setUTCDate(date.getUTCDate()-date.getUTCDay());if(event.key==='End')date.setUTCDate(date.getUTCDate()+6-date.getUTCDay());if(event.key==='PageUp'||event.key==='PageDown'){const day=date.getUTCDate();date.setUTCDate(1);date.setUTCMonth(date.getUTCMonth()+(event.key==='PageUp'?-1:1)*(event.shiftKey?12:1));date.setUTCDate(Math.min(day,new Date(Date.UTC(date.getUTCFullYear(),date.getUTCMonth()+1,0)).getUTCDate()));}if(date.getUTCFullYear()>=1900&&date.getUTCFullYear()<=9999){const dialog=content.querySelector('.calendar'),next=date.toISOString().slice(0,10);dialog.dataset.month=next.slice(0,7);drawCalendar(dialog,next);}});
  view.restore=saved=>{if(!saved)return;const pages=['home','finance','list','detail','form','stock','explanation','sales','sales-day','prefs'];if(pages.includes(saved.page))s.page=saved.page;if(Object.keys(labels).includes(saved.area))s.area=saved.area;if(['pay','receive'].includes(saved.kind))s.kind=saved.kind;if(Object.keys(groupLabel).includes(saved.filter))s.filter=saved.filter;if(accounts.some(a=>a.id===saved.selected))s.selected=saved.selected;s.stockOnly=saved.stockOnly!==false;if(saved.draftFor===s.selected&&saved.draft){s.draftFor=s.selected;if(['full','partial'].includes(saved.draft.mode))s.draft.mode=saved.draft.mode;for(const key of ['amount','method','notes'])if(typeof saved.draft[key]==='string')s.draft[key]=saved.draft[key].slice(0,300);if(validDate(saved.draft.date))s.draft.date=saved.draft.date;}s.history=s.page==='home'?[]:[{page:'home',area:'inicio',kind:s.kind,filter:s.filter,selected:s.selected,stockOnly:true}];s.errors={};render();};
 }
 function restore(saved){if(saved?.focusVersion!==1||views.some(v=>v.s.busy))return;if(saved.design){const d=saved.design;if(['chat','light','dark'].includes(d.appearance))design.appearance=d.appearance;if(['soft','pure'].includes(d.background))design.background=d.background;if(['standard','reduced'].includes(d.motion))design.motion=d.motion;if(typeof d.accent==='string'&&/^#[0-9a-f]{6}$/i.test(d.accent))design.accent=d.accent;if(Number.isFinite(d.scale))design.scale=Math.max(100,Math.min(200,d.scale));}payments.splice(0);for(const p of Array.isArray(saved.payments)?saved.payments.slice(0,30):[]){const a=accounts.find(a=>a.id===p.account);if(a&&Number.isSafeInteger(p.amount)&&p.amount>0&&p.amount<=balance(a)&&validDate(p.date)&&methods[a.kind][p.method])payments.push({account:p.account,amount:p.amount,date:p.date,method:p.method,notes:typeof p.notes==='string'?p.notes.slice(0,300):''});}for(const v of views)v.restore(saved.views?.[v.device]);applyDesign();}
 for(const view of views)view.render();restore(initial);
 window.addEventListener('openai:set_globals',event=>{const saved=event.detail?.globals?.widgetState?.privateContent;if(saved?.focusVersion!==1||known.has(canonical(saved)))return;remember(saved);restore(saved);});
 reducedSystem.addEventListener('change',applyDesign);
 if(globalThis.Tweak){const t=new Tweak({container:root,onChange:()=>{applyDesign();save();}});t.addSelect(design,'appearance',{label:'Aparência',options:[{label:'Seguir o chat',value:'chat'},{label:'Claro',value:'light'},{label:'Escuro',value:'dark'}]});t.addSelect(design,'background',{label:'Fundo',options:[{label:'Suave',value:'soft'},{label:'Branco / preto',value:'pure'}]});t.addSelect(design,'motion',{label:'Movimento',options:[{label:'Padrão',value:'standard'},{label:'Reduzido',value:'reduced'}]});t.addSlider(design,'scale',{label:'Tamanho do texto',min:100,max:200,step:25,unit:'%'});}
 let reserved=1250,width=0,frame=0;new ResizeObserver(()=>{if(frame)return;frame=requestAnimationFrame(()=>{frame=0;const nextWidth=Math.round(root.getBoundingClientRect().width);if(width!==nextWidth){reserved=1250;width=nextWidth;}for(const v of views)if(v.app.getClientRects().length)reserved=Math.max(reserved,Math.ceil(v.app.getBoundingClientRect().height)+28);root.style.setProperty('--focus-stage',reserved+'px');});}).observe(root);
