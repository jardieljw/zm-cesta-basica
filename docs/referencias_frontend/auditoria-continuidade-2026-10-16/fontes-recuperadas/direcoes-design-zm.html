<style>
#zm-design-comparison .product { --page:light-dark(#edf2f9,#141c29); --surface:light-dark(#ffffff,#222e40); --field:light-dark(#f5f7fb,#29364b); --ink:light-dark(#1c304b,#edf2fa); --secondary:light-dark(#526681,#b7c7dc); --line:light-dark(#d7e1ef,#465873); --brand:light-dark(#2364aa,#a8cffb); --on-brand:light-dark(#ffffff,#122b49); --selected:light-dark(#e9f2fe,#354e6f); --shadow:light-dark(#28466a22,#00000070); --highlight:light-dark(#ffffff,#577498); --warn:light-dark(#865217,#ffc782); --warn-bg:light-dark(#fff1dd,#503f29); --space:24px; --radius:16px; --lift:3; position:relative; min-height:1120px; padding:24px; background:var(--page); color:var(--ink); font:15px/1.45 'Segoe UI',system-ui,sans-serif; border-radius:22px; container-type:inline-size; }
#zm-design-comparison .product *,#zm-design-comparison .product *:before,#zm-design-comparison .product *:after {box-sizing:border-box;}
#zm-design-comparison h2,#zm-design-comparison h3,#zm-design-comparison p {margin:0;}
#zm-design-comparison h2 {font-size:24px;font-weight:500;letter-spacing:-.5px;}
#zm-design-comparison h3 {font-size:16px;font-weight:500;}
#zm-design-comparison .header {padding-right:94px;margin-bottom:24px;}
#zm-design-comparison .eyebrow {color:var(--secondary);font-size:12px;margin-bottom:5px;}
#zm-design-comparison .summary {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:20px 0;margin-bottom:24px;border-radius:var(--radius);background:var(--surface);box-shadow:0 calc(var(--lift)*1px) calc(var(--lift)*4px) var(--shadow);}
#zm-design-comparison .metric {padding:0 20px;min-width:0;}
#zm-design-comparison .metric + .metric {border-left:1px solid var(--line);}
#zm-design-comparison .metric-label {color:var(--secondary);font-size:12px;display:block;}
#zm-design-comparison .metric-value {font-weight:500;font-size:24px;display:block;margin-top:7px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;letter-spacing:-.5px;}
#zm-design-comparison .metric:not(:first-child) .metric-value {font-size:22px;}
#zm-design-comparison .panel {background:var(--surface);padding:20px;border-radius:var(--radius);box-shadow:0 calc(var(--lift)*1px) calc(var(--lift)*4px) var(--shadow);}
#zm-design-comparison .panel-heading {display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;}
#zm-design-comparison .icon-action {width:44px;flex-shrink:0;}
#zm-design-comparison .fields {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space);align-items:start;}
#zm-design-comparison .field {min-width:0;position:relative;}
#zm-design-comparison .wide {grid-column:1/-1;}
#zm-design-comparison .field-label {display:block;font-size:12px;color:var(--secondary);margin-bottom:7px;}
#zm-design-comparison button,#zm-design-comparison input {font:inherit;color:inherit;}
#zm-design-comparison button {display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border:1px solid var(--line);border-radius:14px;padding:10px 14px;background:var(--surface);transition:transform 180ms ease,box-shadow 180ms ease,background 180ms ease;}
#zm-design-comparison button:hover {background:var(--selected);}
#zm-design-comparison button:active {transform:scale(.985);}
#zm-design-comparison .picker-trigger {width:100%;min-height:52px;justify-content:flex-start;border-color:transparent;background:var(--field);text-align:left;border-radius:16px;padding:13px 14px;}
#zm-design-comparison .picker-trigger[aria-expanded=true] {background:var(--selected);}
#zm-design-comparison .picker-value {flex:1;min-width:0;overflow-wrap:anywhere;}
#zm-design-comparison .muted {color:var(--secondary);}
#zm-design-comparison .picker-trigger svg {flex-shrink:0;width:18px;height:18px;}
#zm-design-comparison .money-field {display:flex;align-items:center;background:var(--field);border:1px solid transparent;border-radius:16px;min-height:52px;padding:0 14px;gap:8px;}
#zm-design-comparison .money-field span {color:var(--secondary);}
#zm-design-comparison .money-field input {border:0;background:transparent;min-height:50px;min-width:0;width:100%;padding:10px 0;font-variant-numeric:tabular-nums;}
#zm-design-comparison input::placeholder {color:var(--secondary);opacity:1;}
#zm-design-comparison .expansion {display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows 220ms ease,opacity 220ms ease,transform 220ms ease;transform:translateY(-5px);visibility:hidden;}
#zm-design-comparison .expansion.open {grid-template-rows:1fr;opacity:1;transform:translateY(0);visibility:visible;}
#zm-design-comparison .expansion-content {overflow:hidden;min-height:0;}
#zm-design-comparison .picker-surface {margin-top:8px;padding:8px;border-radius:16px;background:var(--field);border:1px solid var(--line);}
#zm-design-comparison .choice {display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;min-height:48px;}
#zm-design-comparison .choice:hover {background:var(--selected);}
#zm-design-comparison .choice:has(input:checked) {background:var(--selected);}
#zm-design-comparison .choice input {accent-color:var(--brand);flex-shrink:0;margin:0;width:17px;height:17px;}
#zm-design-comparison .choice-text {display:flex;flex-direction:column;min-width:0;}
#zm-design-comparison .choice-name {font-weight:500;}
#zm-design-comparison .choice-detail {color:var(--secondary);font-size:12px;margin-top:2px;}
#zm-design-comparison .search {border:1px solid var(--line);border-radius:12px;background:var(--surface);width:100%;padding:12px;min-height:46px;margin-bottom:6px;}
#zm-design-comparison .range-presets {display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;}
#zm-design-comparison .range-presets button {font-size:12px;flex:1;padding:8px;min-width:72px;background:var(--surface);}
#zm-design-comparison .calendar-head {display:flex;align-items:center;gap:4px;justify-content:space-between;margin:4px 0;}
#zm-design-comparison .calendar-month {font-weight:500;text-align:center;font-size:14px;}
#zm-design-comparison .calendar-nav {width:38px;padding:6px;flex-shrink:0;border-color:transparent;background:transparent;}
#zm-design-comparison .calendar-grid {display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0;}
#zm-design-comparison .day-name {font-size:11px;text-align:center;padding:8px 0;color:var(--secondary);}
#zm-design-comparison .calendar-day {min-height:44px;min-width:0;padding:5px 0;border:0;border-radius:12px;background:transparent;font-size:13px;}
#zm-design-comparison .calendar-day.in-range {background:var(--selected);border-radius:0;}
#zm-design-comparison .calendar-day[aria-pressed=true] {background:var(--brand);color:var(--on-brand);border-radius:12px;}
#zm-design-comparison .range-caption {font-size:12px;color:var(--secondary);min-height:22px;margin:8px 4px;}
#zm-design-comparison .calendar-actions {display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;}
#zm-design-comparison .calendar-actions button {font-size:13px;}
#zm-design-comparison .actions {display:flex;justify-content:flex-end;align-items:center;gap:12px;flex-wrap:wrap;margin-top:24px;}
#zm-design-comparison .primary {background:var(--brand);color:var(--on-brand);border-color:var(--brand);box-shadow:0 3px 9px var(--shadow);}
#zm-design-comparison .primary:hover {background:var(--brand);box-shadow:0 5px 14px var(--shadow);}
#zm-design-comparison .quiet {border-color:transparent;background:transparent;color:var(--secondary);}
#zm-design-comparison .feedback {color:var(--secondary);font-size:12px;min-height:20px;margin-top:14px;}
#zm-design-comparison .error {color:var(--warn);}
#zm-design-comparison .results {margin-top:24px;}
#zm-design-comparison .results-heading {display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:12px;}
#zm-design-comparison .result-count {font-size:12px;color:var(--secondary);}
#zm-design-comparison .account {display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;border-top:1px solid var(--line);padding:16px 2px;}
#zm-design-comparison .account-name {font-weight:500;}
#zm-design-comparison .account-detail {font-size:12px;color:var(--secondary);margin-top:4px;overflow-wrap:anywhere;}
#zm-design-comparison .account-right {text-align:right;}
#zm-design-comparison .account-value {font-weight:500;font-variant-numeric:tabular-nums;}
#zm-design-comparison .badge {display:inline-block;padding:3px 8px;border-radius:20px;background:var(--field);color:var(--secondary);font-size:11px;margin-top:5px;}
#zm-design-comparison .badge.overdue {color:var(--warn);background:var(--warn-bg);}
#zm-design-comparison .empty {padding:32px 6px;text-align:center;color:var(--secondary);}
#zm-design-comparison .glass {--lift:5;background:linear-gradient(145deg,light-dark(#e6effd,#192b44),var(--page) 55%,light-dark(#e8edf5,#202636));}
#zm-design-comparison .glass .summary {padding:0;gap:12px;background:transparent;box-shadow:none;}
#zm-design-comparison .glass .metric {padding:18px 16px;border:1px solid var(--highlight);border-radius:var(--radius);background:linear-gradient(150deg,var(--surface),var(--field));box-shadow:0 calc(var(--lift)*1px) calc(var(--lift)*4px) var(--shadow);}
#zm-design-comparison .glass .panel {border:1px solid var(--highlight);background:var(--surface);}
#zm-design-comparison .glass .picker-trigger,#zm-design-comparison .glass .money-field {background:linear-gradient(155deg,var(--surface),var(--field));border:1px solid var(--highlight);box-shadow:inset 0 1px 0 var(--highlight),0 3px 10px var(--shadow);}
#zm-design-comparison .glass .picker-trigger:hover {transform:translateY(-1px);box-shadow:inset 0 1px 0 var(--highlight),0 6px 15px var(--shadow);}
#zm-design-comparison .glass .picker-trigger:active {transform:translateY(1px) scale(.985);}
#zm-design-comparison .glass .expansion {position:absolute;left:0;right:0;top:100%;z-index:8;}
#zm-design-comparison .glass .picker-surface {background:var(--surface);box-shadow:0 12px 30px var(--shadow);border:1px solid var(--highlight);}
#zm-design-comparison .glass .wide .choice-list {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;}
#zm-design-comparison .glass .panel-heading {padding:0 2px 14px;border-bottom:1px solid var(--line);}
#zm-design-comparison .product[data-motion=false] button,#zm-design-comparison .product[data-motion=false] .expansion {transition:none;transform:none;}
#zm-design-comparison [hidden] {display:none!important;}
@container (max-width:480px) {
  #zm-design-comparison .fields {grid-template-columns:1fr;}
  #zm-design-comparison .metric {padding:0 12px;}
  #zm-design-comparison .summary {grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 0;}
  #zm-design-comparison .metric:first-child {grid-column:1/-1;}
  #zm-design-comparison .metric:nth-child(2) {border-left:0;}
  #zm-design-comparison .metric-value {font-size:26px;}
  #zm-design-comparison .glass .summary {gap:12px;}
  #zm-design-comparison .glass .metric {padding:16px;}
  #zm-design-comparison .glass .wide .choice-list {grid-template-columns:1fr;}
  #zm-design-comparison .account {grid-template-columns:1fr;gap:6px;}
  #zm-design-comparison .account-right {text-align:left;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  #zm-design-comparison .badge {margin-top:0;}
}
@media (max-width:550px) {
  #zm-design-comparison .product {padding:16px;min-height:1560px;border-radius:18px;}
  #zm-design-comparison .panel {padding:14px;}
  #zm-design-comparison h2 {font-size:21px;}
  #zm-design-comparison .header {padding-right:92px;}
  #zm-design-comparison .money-field input,#zm-design-comparison .search {font-size:16px;}
}
@media (prefers-reduced-motion:reduce) {#zm-design-comparison button,#zm-design-comparison .expansion {transition:none!important;transform:none!important;}}
</style>
<div id="zm-design-comparison" class="viz-carousel viz-dotted-background" aria-label="Direções visuais para ZM Cesta Básica" data-previous-label="Anterior" data-next-label="Próxima">
  <section data-variant="Camadas suaves" aria-label="Camadas suaves"><div class="product soft" data-style="soft" aria-label="Camadas suaves — painel alinhado"></div></section>
  <section data-variant="Vidro nos controles" aria-label="Vidro nos controles" hidden><div class="product glass" data-style="glass" aria-label="Vidro nos controles — painel alinhado"></div></section>
</div>
<template id="zm-design-panel-template">
  <header class="header"><div class="eyebrow">ZM Cesta Básica · Prévia</div><h2>Contas a Receber</h2></header>
  <div class="summary" aria-label="Resumo dos resultados">
    <div class="metric"><span class="metric-label">A receber</span><strong class="metric-value" data-metric="balance">R$ 1.050,00</strong></div>
    <div class="metric"><span class="metric-label">Contas em aberto</span><strong class="metric-value" data-metric="open">2</strong></div>
    <div class="metric"><span class="metric-label">Contas parciais</span><strong class="metric-value" data-metric="partial">1</strong></div>
  </div>
  <form class="panel" aria-label="Filtros alinhados">
    <div class="panel-heading"><h3>Filtros</h3><button class="icon-action refresh cursor-interaction" type="button" aria-label="Atualizar resultados"><i data-lucide="refresh-cw" aria-hidden="true"></i></button></div>
    <div class="fields">
      <div class="field wide" data-field="status"><span class="field-label">Situação</span><button class="picker-trigger cursor-interaction" type="button" aria-expanded="false"><i data-lucide="list-filter" aria-hidden="true"></i><span class="picker-value">Todas</span><i data-lucide="chevron-down" aria-hidden="true"></i></button><div class="expansion" inert><div class="expansion-content"><div class="picker-surface"><div class="choice-list"></div></div></div></div></div>
      <div class="field" data-field="sale"><span class="field-label">Período da venda</span><button class="picker-trigger cursor-interaction" type="button" aria-expanded="false"><i data-lucide="calendar-days" aria-hidden="true"></i><span class="picker-value">Qualquer período</span><i data-lucide="chevron-down" aria-hidden="true"></i></button><div class="expansion" inert><div class="expansion-content"><div class="picker-surface calendar"></div></div></div></div>
      <div class="field" data-field="due"><span class="field-label">Período do vencimento</span><button class="picker-trigger cursor-interaction" type="button" aria-expanded="false"><i data-lucide="calendar-days" aria-hidden="true"></i><span class="picker-value">Qualquer período</span><i data-lucide="chevron-down" aria-hidden="true"></i></button><div class="expansion" inert><div class="expansion-content"><div class="picker-surface calendar"></div></div></div></div>
      <div class="field" data-field="customer"><span class="field-label">Cliente</span><button class="picker-trigger cursor-interaction" type="button" aria-expanded="false"><i data-lucide="users" aria-hidden="true"></i><span class="picker-value">Todos os clientes</span><i data-lucide="chevron-down" aria-hidden="true"></i></button><div class="expansion" inert><div class="expansion-content"><div class="picker-surface"><input class="search" type="search" placeholder="Buscar cliente" aria-label="Buscar cliente"><div class="choice-list"></div><p class="no-choice muted" hidden>Nenhum cliente encontrado.</p></div></div></div></div>
      <div class="field" data-field="basket"><span class="field-label">Tipo de cesta</span><button class="picker-trigger cursor-interaction" type="button" aria-expanded="false"><i data-lucide="shopping-basket" aria-hidden="true"></i><span class="picker-value">Todos os tipos</span><i data-lucide="chevron-down" aria-hidden="true"></i></button><div class="expansion" inert><div class="expansion-content"><div class="picker-surface"><div class="choice-list"></div></div></div></div></div>
      <label class="field"><span class="field-label">Valor mínimo</span><span class="money-field"><span>R$</span><input name="minimum" inputmode="decimal" placeholder="Sem mínimo" aria-label="Valor mínimo"></span></label>
      <label class="field"><span class="field-label">Valor máximo</span><span class="money-field"><span>R$</span><input name="maximum" inputmode="decimal" placeholder="Sem limite" aria-label="Valor máximo"></span></label>
    </div>
    <div class="actions"><button class="quiet clear cursor-interaction" type="button">Limpar</button><button class="primary apply cursor-interaction" type="button">Aplicar filtros<i data-lucide="arrow-right" aria-hidden="true"></i></button></div>
    <p class="feedback" aria-live="polite">Resumo dos resultados · Dados de exemplo</p>
  </form>
  <section class="results" aria-label="Contas encontradas"><div class="results-heading"><h3>Contas</h3><span class="result-count">5 resultados</span></div><div class="account-list"></div></section>
</template>
<script>
(() => {
  const root=document.getElementById('zm-design-comparison');
  const template=document.getElementById('zm-design-panel-template');
  const demo=[
    {id:'ana',name:'Ana Souza',basket:'basica',sale:'2026-10-01',due:'2026-10-10',original:48000,paid:0,status:'open'},
    {id:'bruno',name:'Bruno Lima',basket:'basica',sale:'2026-10-03',due:'2026-10-12',original:45000,paid:15000,status:'partial'},
    {id:'carla',name:'Carla Alves',basket:'carne',sale:'2026-10-10',due:'2026-10-28',original:27000,paid:0,status:'open'},
    {id:'diego',name:'Diego Santos',basket:'carne',sale:'2026-09-26',due:'2026-10-08',original:20000,paid:20000,status:'paid'},
    {id:'eva',name:'Eva Rocha',basket:'basica',sale:'2026-09-25',due:'2026-10-05',original:18000,paid:0,status:'canceled'}
  ];
  const statuses=[['all','Todas','Todas as situações'],['open','Em aberto','Sem recebimento'],['partial','Parcial','Parte recebida, ainda há saldo'],['overdue','Vencidas','Em aberto ou parciais após o prazo'],['paid','Pagas','Saldo quitado'],['canceled','Canceladas','Contas canceladas']];
  const money=c=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(c/100);
  const number=c=>new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(c/100);
  const date=s=>s.split('-').reverse().join('/');
  const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const defaults=()=>({status:'all',customer:'all',basket:'all',sale:null,due:null,minimum:'',maximum:''});
  const copy=x=>JSON.parse(JSON.stringify(x));
  const cents=s=>{const cleaned=s.replace(/\s|R\$|\./g,'');if(!cleaned)return null;if(!/^\d+(,\d{0,2})?$/.test(cleaned))return NaN;const [whole,part='']=cleaned.split(',');const result=Number(whole)*100+Number(part.padEnd(2,'0'));return Number.isSafeInteger(result)?result:NaN;};
  const states={};
  const save=style=>{if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{preview:'ZM Cesta Básica',exploring:style==='soft'?'Camadas suaves':'Vidro nos controles',spacing:states[style].design.space,radius:states[style].design.radius,productionImplementation:false},privateContent:{variants:Object.fromEntries(Object.entries(states).map(([key,value])=>[key,{draft:value.draft,applied:value.applied,design:value.design}]))}}).catch(()=>{});};
  const restore=(style,saved)=>{if(!saved?.draft||!saved?.applied)return;const s=states[style];s.draft={...defaults(),...saved.draft};s.applied={...defaults(),...saved.applied};if(saved.design)s.design={...s.design,...saved.design};s.sync();s.renderResults();s.renderDesign();};
  for(const product of root.querySelectorAll('.product')) {
    product.appendChild(template.content.cloneNode(true));
    const style=product.dataset.style;
    const form=product.querySelector('form');
    const feedback=product.querySelector('.feedback');
    const state={draft:defaults(),applied:defaults(),design:{space:24,radius:16,motion:true},open:null,calendars:{}};
    states[style]=state;
    const markDirty=()=>{feedback.textContent='Alterações nos filtros · Aplicar para atualizar';feedback.classList.remove('error');save(style);};
    const close=()=>{if(!state.open)return;const f=state.open;f.querySelector('.picker-trigger').setAttribute('aria-expanded','false');const area=f.querySelector('.expansion');area.classList.remove('open');area.inert=true;state.open=null;};
    const choose=(field,value)=>{state.draft[field.dataset.field]=value;state.sync();close();field.querySelector('.picker-trigger').focus();markDirty();};
    function makeChoice(field,item) {
      const label=document.createElement('label');label.className='choice cursor-interaction';
      const radio=document.createElement('input');radio.type='radio';radio.name=style+'-'+field.dataset.field;radio.value=item[0];radio.checked=state.draft[field.dataset.field]===item[0];
      const text=document.createElement('span');text.className='choice-text';
      const title=document.createElement('span');title.className='choice-name';title.textContent=item[1];text.appendChild(title);
      if(item[2]){const detail=document.createElement('span');detail.className='choice-detail';detail.textContent=item[2];text.appendChild(detail);}
      radio.addEventListener('change',()=>choose(field,item[0]));label.append(radio,text);return label;
    }
    function itemsFor(name){return name==='status'?statuses:name==='customer'?[['all','Todos os clientes','Sem restringir cliente'],...demo.map(r=>[r.id,r.name,'Cliente cadastrado'])]:[['all','Todos os tipos','Sem restringir cesta'],['basica','Cesta Básica','Alimentação e limpeza'],['carne','Cesta de Carne','Tipo cadastrado']];}
    function fillChoices(field,term='') {
      const name=field.dataset.field;const list=field.querySelector('.choice-list');list.replaceChildren();
      const normalize=x=>x.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
      const choices=itemsFor(name).filter(item=>!term||normalize(item[1]).includes(normalize(term)));
      for(const item of choices)list.appendChild(makeChoice(field,item));
      const empty=field.querySelector('.no-choice');if(empty)empty.hidden=choices.length!==0;
    }
    function renderCalendar(field) {
      const name=field.dataset.field;const cal=state.calendars[name];const target=field.querySelector('.calendar');target.replaceChildren();
      const makeButton=(label,handler,cls='')=>{const button=document.createElement('button');button.type='button';button.className=cls+' cursor-interaction';button.textContent=label;button.addEventListener('click',handler);return button;};
      const presets=document.createElement('div');presets.className='range-presets';
      presets.append(makeButton('Este mês',()=>{cal.range=['2026-10-01','2026-10-31'];cal.month=new Date(2026,9,1);renderCalendar(field);}),makeButton('30 dias',()=>{cal.range=['2026-09-15','2026-10-14'];cal.month=new Date(2026,9,1);renderCalendar(field);}));
      const head=document.createElement('div');head.className='calendar-head';
      const title=document.createElement('span');title.className='calendar-month';title.textContent=new Intl.DateTimeFormat('pt-BR',{month:'long',year:'numeric'}).format(cal.month);
      const previous=makeButton('‹',()=>{cal.month=new Date(cal.month.getFullYear(),cal.month.getMonth()-1,1);renderCalendar(field);},'calendar-nav');previous.setAttribute('aria-label','Mês anterior');
      const next=makeButton('›',()=>{cal.month=new Date(cal.month.getFullYear(),cal.month.getMonth()+1,1);renderCalendar(field);},'calendar-nav');next.setAttribute('aria-label','Próximo mês');head.append(previous,title,next);
      const grid=document.createElement('div');grid.className='calendar-grid';grid.setAttribute('aria-label','Selecionar início e fim do período');
      for(const day of ['D','S','T','Q','Q','S','S']){const cell=document.createElement('span');cell.className='day-name';cell.textContent=day;grid.appendChild(cell);}
      const offset=cal.month.getDay(),count=new Date(cal.month.getFullYear(),cal.month.getMonth()+1,0).getDate();
      for(let i=0;i<offset;i++)grid.appendChild(document.createElement('span'));
      for(let day=1;day<=count;day++){
        const value=iso(new Date(cal.month.getFullYear(),cal.month.getMonth(),day));
        const button=makeButton(String(day),()=>{if(!cal.range||cal.range[1])cal.range=[value,null];else cal.range=[cal.range[0],value].sort();renderCalendar(field);},'calendar-day');
        button.setAttribute('aria-label',date(value));button.setAttribute('aria-pressed',String(!!cal.range&&cal.range.includes(value)));
        if(cal.range?.[1]&&value>cal.range[0]&&value<cal.range[1])button.classList.add('in-range');grid.appendChild(button);
      }
      const caption=document.createElement('p');caption.className='range-caption';caption.setAttribute('aria-live','polite');caption.textContent=cal.range?cal.range[1]?date(cal.range[0])+' a '+date(cal.range[1]):date(cal.range[0])+' · Escolha a data final':'Escolha a data inicial e a final';
      const actions=document.createElement('div');actions.className='calendar-actions';
      actions.append(makeButton('Sem período',()=>choose(field,null),'quiet'));
      const confirm=makeButton('Confirmar',()=>choose(field,copy(cal.range)),'primary');confirm.disabled=!cal.range?.[1];actions.appendChild(confirm);
      target.append(presets,head,grid,caption,actions);
    }
    for(const field of product.querySelectorAll('[data-field]')) {
      const name=field.dataset.field,trigger=field.querySelector('.picker-trigger'),area=field.querySelector('.expansion');
      area.id=style+'-picker-'+name;trigger.setAttribute('aria-controls',area.id);trigger.setAttribute('aria-label',field.querySelector('.field-label').textContent);
      trigger.addEventListener('click',()=>{const wasOpen=state.open===field;close();if(wasOpen)return;
        state.open=field;if(name==='sale'||name==='due'){state.calendars[name]={month:new Date(2026,9,1),range:state.draft[name]?copy(state.draft[name]):null};renderCalendar(field);}else fillChoices(field);
        area.inert=false;area.classList.add('open');trigger.setAttribute('aria-expanded','true');
        const search=field.querySelector('.search');if(search){search.value='';search.focus();}
      });
      const search=field.querySelector('.search');if(search){search.addEventListener('input',()=>fillChoices(field,search.value));search.addEventListener('keydown',event=>{if(event.key==='Enter')event.preventDefault();});}
    }
    product.addEventListener('keydown',event=>{if(event.key==='Escape'&&state.open){event.preventDefault();const trigger=state.open.querySelector('.picker-trigger');close();trigger.focus();}});
    product.addEventListener('click',event=>{if(state.open&&!event.composedPath().includes(state.open))close();});
    for(const name of ['minimum','maximum']) {
      const input=form.elements.namedItem(name);
      input.addEventListener('input',()=>{state.draft[name]=input.value;markDirty();});
      input.addEventListener('blur',()=>{const value=cents(input.value);if(value!==null&&Number.isFinite(value)){input.value=number(value);state.draft[name]=input.value;save(style);}});
    }
    state.sync=()=>{
      for(const field of product.querySelectorAll('[data-field]')){
        const name=field.dataset.field,value=state.draft[name];
        field.querySelector('.picker-value').textContent=name==='sale'||name==='due'?value?date(value[0])+' a '+date(value[1]):'Qualquer período':itemsFor(name).find(item=>item[0]===value)?.[1]||itemsFor(name)[0][1];
      }
      for(const name of ['minimum','maximum'])form.elements.namedItem(name).value=state.draft[name];
    };
    state.renderResults=()=>{
      const f=state.applied,min=cents(f.minimum),max=cents(f.maximum);
      const rows=demo.filter(r=>{
        const isPending=r.status==='open'||r.status==='partial';
        return (f.status==='all'||f.status===r.status||(f.status==='overdue'&&isPending&&r.due<'2026-10-14'))&&(f.customer==='all'||f.customer===r.id)&&(f.basket==='all'||f.basket===r.basket)&&(!f.sale||(r.sale>=f.sale[0]&&r.sale<=f.sale[1]))&&(!f.due||(r.due>=f.due[0]&&r.due<=f.due[1]))&&(min===null||r.original>=min)&&(max===null||r.original<=max);
      });
      product.querySelector('[data-metric=balance]').textContent=money(rows.reduce((sum,r)=>sum+(['open','partial'].includes(r.status)?r.original-r.paid:0),0));
      product.querySelector('[data-metric=open]').textContent=String(rows.filter(r=>r.status==='open').length);
      product.querySelector('[data-metric=partial]').textContent=String(rows.filter(r=>r.status==='partial').length);
      product.querySelector('.result-count').textContent=rows.length+' '+(rows.length===1?'resultado':'resultados');
      const list=product.querySelector('.account-list');list.replaceChildren();
      if(!rows.length){const empty=document.createElement('p');empty.className='empty';empty.textContent='Nenhuma conta encontrada com esses filtros.';list.appendChild(empty);}
      for(const row of rows){
        const account=document.createElement('div');account.className='account';
        const left=document.createElement('div'),right=document.createElement('div');right.className='account-right';
        const name=document.createElement('div');name.className='account-name';name.textContent=row.name;
        const detail=document.createElement('div');detail.className='account-detail';detail.textContent=(row.basket==='basica'?'Cesta Básica':'Cesta de Carne')+' · Vencimento '+date(row.due);
        const original=document.createElement('div');original.className='account-detail';original.textContent='Valor '+money(row.original)+' · Recebido '+money(row.paid);
        left.append(name,detail,original);
        const value=document.createElement('div');value.className='account-value';value.textContent=money(['open','partial'].includes(row.status)?row.original-row.paid:0);
        const badge=document.createElement('span');badge.className='badge';const overdue=['open','partial'].includes(row.status)&&row.due<'2026-10-14';
        badge.textContent=statuses.find(s=>s[0]===row.status)[1]+(overdue?' · Vencida':'');if(overdue)badge.classList.add('overdue');
        right.append(value,badge);account.append(left,right);list.appendChild(account);
      }
    };
    state.renderDesign=()=>{product.style.setProperty('--space',state.design.space+'px');product.style.setProperty('--radius',state.design.radius+'px');product.dataset.motion=String(state.design.motion);};
    const applyFilters=()=>{
      const min=cents(state.draft.minimum),max=cents(state.draft.maximum);
      if(Number.isNaN(min)||Number.isNaN(max)||(min!==null&&max!==null&&min>max)){feedback.textContent='Revise os valores: use até dois centavos e mínimo menor ou igual ao máximo.';feedback.classList.add('error');return;}
      close();state.applied=copy(state.draft);state.renderResults();feedback.classList.remove('error');feedback.textContent='Filtros aplicados · Dados de exemplo';save(style);
    };
    product.querySelector('.apply').addEventListener('click',applyFilters);
    form.addEventListener('submit',event=>{event.preventDefault();applyFilters();});
    for(const name of ['minimum','maximum'])form.elements.namedItem(name).addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();applyFilters();}});
    product.querySelector('.clear').addEventListener('click',()=>{close();state.draft=defaults();state.sync();markDirty();});
    product.querySelector('.refresh').addEventListener('click',()=>{state.renderResults();feedback.textContent='Resultados atualizados com os filtros aplicados · Dados de exemplo';save(style);});
    state.sync();state.renderResults();state.renderDesign();
    restore(style,window.openai?.widgetState?.privateContent?.variants?.[style]);
    if(globalThis.Tweak){const tweak=new Tweak({container:product,onChange:()=>{state.renderDesign();save(style);}});tweak.addSlider(state.design,'space',{label:'Espaçamento dos campos',min:16,max:32,step:4,unit:'px'});tweak.addSlider(state.design,'radius',{label:'Cantos dos painéis',min:12,max:24,step:2,unit:'px'});tweak.addToggle(state.design,'motion',{label:'Animações'});}
  }
  window.addEventListener('openai:set_globals',event=>{const variants=event.detail?.globals?.widgetState?.privateContent?.variants;if(variants)for(const style of Object.keys(states))restore(style,variants[style]);});
})();
</script>
