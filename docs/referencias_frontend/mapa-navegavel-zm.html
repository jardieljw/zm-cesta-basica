<style>
#zm-navigation-demo {width:100%;}
#zm-navigation-demo .stage {padding:16px 0;min-height:970px;display:flex;justify-content:center;align-items:flex-start;}
#zm-navigation-demo .app {--page:light-dark(#f6f7f9,#141518);--surface:light-dark(#ffffff,#24262b);--ink:light-dark(#222730,#eef0f5);--sub:light-dark(#5c6472,#b6becb);--line:light-dark(#e0e4eb,#454b57);--accent:light-dark(#2866ae,#a7caff);--accent-ink:light-dark(#ffffff,#142947);--soft:light-dark(#edf4fd,#2b3e57);--warn:light-dark(#80501a,#f2c78d);--warn-fill:light-dark(#fff2df,#4b3b29);--shadow:light-dark(#16243e18,#00000055);--radius:18px; width:100%;max-width:420px;position:relative;overflow:clip;background:var(--page);color:var(--ink);border:1px solid var(--line);border-radius:26px;box-shadow:0 15px 45px var(--shadow);font:15px/1.45 'Segoe UI',system-ui,sans-serif;}
#zm-navigation-demo .app * {box-sizing:border-box;}
#zm-navigation-demo button {font:inherit;color:inherit;min-height:44px;border:0;background:transparent;border-radius:12px;transition:background 160ms ease,transform 160ms ease;}
#zm-navigation-demo button:hover {background:var(--soft);}
#zm-navigation-demo button:active {transform:scale(.985);}
#zm-navigation-demo .app h2,#zm-navigation-demo .app h3,#zm-navigation-demo .app p {margin:0;}
#zm-navigation-demo .app h2 {font-size:23px;font-weight:500;letter-spacing:-.6px;}
#zm-navigation-demo .app h3 {font-size:16px;font-weight:500;}
#zm-navigation-demo .demo-label {padding:13px 96px 13px 18px;font-size:11px;color:var(--sub);border-bottom:1px solid var(--line);background:var(--surface);}
#zm-navigation-demo .frame {display:grid;grid-template-areas:'header' 'content' 'nav';grid-template-columns:minmax(0,1fr);}
#zm-navigation-demo .app-header {grid-area:header;display:flex;align-items:center;gap:10px;padding:20px 18px 12px;}
#zm-navigation-demo .app-header > div {min-width:0;}
#zm-navigation-demo .brand {color:var(--sub);font-size:12px;margin-bottom:3px;}
#zm-navigation-demo .back {width:44px;flex-shrink:0;background:var(--surface);box-shadow:0 2px 8px var(--shadow);}
#zm-navigation-demo .back svg {width:18px;height:18px;}
#zm-navigation-demo .content {grid-area:content;padding:0 18px 24px;min-height:650px;min-width:0;}
#zm-navigation-demo .content-inner {display:grid;gap:20px;}
#zm-navigation-demo .context {font-size:12px;color:var(--sub);padding-bottom:2px;}
#zm-navigation-demo .hero {padding:22px;border-radius:var(--radius);background:var(--surface);box-shadow:0 5px 20px var(--shadow);}
#zm-navigation-demo .hero.finance {background:linear-gradient(135deg,var(--surface),var(--soft));}
#zm-navigation-demo .two {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:18px 0;}
#zm-navigation-demo .label {font-size:12px;color:var(--sub);display:block;}
#zm-navigation-demo .amount {font-size:23px;display:block;margin-top:4px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.5px;overflow-wrap:anywhere;}
#zm-navigation-demo .number {font-size:26px;font-weight:500;display:block;margin-top:4px;}
#zm-navigation-demo .primary {background:var(--accent);color:var(--accent-ink);padding:12px 16px;display:flex;gap:10px;align-items:center;justify-content:center;font-weight:500;width:100%;border-radius:14px;}
#zm-navigation-demo .primary:hover {background:var(--accent);box-shadow:0 4px 14px var(--shadow);}
#zm-navigation-demo .primary svg {width:17px;height:17px;}
#zm-navigation-demo .section-header {display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;}
#zm-navigation-demo .section-header small {font-size:12px;color:var(--sub);}
#zm-navigation-demo .tile {padding:16px;background:var(--surface);border-radius:var(--radius);box-shadow:0 3px 14px var(--shadow);}
#zm-navigation-demo .tile-pair {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
#zm-navigation-demo .row {display:flex;align-items:center;gap:12px;padding:16px 12px;min-height:76px;text-align:left;width:100%;background:var(--surface);border-radius:14px;}
#zm-navigation-demo .row > .copy {flex:1;min-width:0;}
#zm-navigation-demo .row .title {display:block;font-weight:500;overflow-wrap:anywhere;}
#zm-navigation-demo .row .subtitle {display:block;font-size:12px;color:var(--sub);margin-top:4px;overflow-wrap:anywhere;}
#zm-navigation-demo .row .value {font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap;}
#zm-navigation-demo .row .arrow {color:var(--sub);width:16px;height:16px;flex-shrink:0;}
#zm-navigation-demo .row-icon {width:40px;height:40px;background:var(--soft);color:var(--accent);border-radius:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
#zm-navigation-demo .row-icon svg {width:19px;height:19px;}
#zm-navigation-demo .rows {display:grid;gap:8px;}
#zm-navigation-demo .tag {display:inline-block;background:var(--warn-fill);color:var(--warn);border-radius:20px;font-size:11px;padding:3px 8px;margin-top:6px;}
#zm-navigation-demo .neutral-tag {background:var(--soft);color:var(--sub);}
#zm-navigation-demo .tabs {display:flex;gap:5px;padding:5px;background:var(--surface);border-radius:16px;}
#zm-navigation-demo .tabs button {flex:1;padding:8px 6px;}
#zm-navigation-demo .tabs button[aria-pressed=true] {background:var(--accent);color:var(--accent-ink);box-shadow:0 2px 6px var(--shadow);}
#zm-navigation-demo .navigation {grid-area:nav;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;padding:8px 6px 12px;background:var(--surface);border-top:1px solid var(--line);}
#zm-navigation-demo .navigation button {display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:11px;min-height:60px;padding:6px 2px;color:var(--sub);}
#zm-navigation-demo .navigation button svg {width:20px;height:20px;}
#zm-navigation-demo .navigation button[aria-current=page] {background:var(--soft);color:var(--accent);font-weight:500;}
#zm-navigation-demo .details {background:var(--surface);border-radius:var(--radius);padding:20px;box-shadow:0 4px 14px var(--shadow);}
#zm-navigation-demo .detail-line {display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line);}
#zm-navigation-demo .detail-line:last-child {border-bottom:0;}
#zm-navigation-demo .detail-line span:first-child {color:var(--sub);}
#zm-navigation-demo .detail-line span:last-child {text-align:right;}
#zm-navigation-demo .detail-amount {font-size:32px;font-weight:500;font-variant-numeric:tabular-nums;margin:8px 0 4px;}
#zm-navigation-demo .note {font-size:12px;color:var(--sub);}
#zm-navigation-demo .result-message {padding:18px;background:var(--soft);border-radius:var(--radius);}
#zm-navigation-demo .result-message p {margin-top:6px;color:var(--sub);}
#zm-navigation-demo .desktop {max-width:none;border-radius:20px;}
#zm-navigation-demo .desktop .frame {grid-template-areas:'nav header' 'nav content';grid-template-columns:140px minmax(0,1fr);}
#zm-navigation-demo .desktop .navigation {display:flex;flex-direction:column;justify-content:flex-start;border-top:0;border-right:1px solid var(--line);padding:18px 10px;gap:8px;}
#zm-navigation-demo .desktop .navigation button {flex-direction:row;justify-content:flex-start;min-height:48px;gap:10px;font-size:13px;padding:10px;}
#zm-navigation-demo .desktop .navigation button svg {flex-shrink:0;}
#zm-navigation-demo .desktop .content {min-height:760px;}
#zm-navigation-demo .desktop .demo-label {padding-right:100px;}
#zm-navigation-demo .desktop .app-header {padding:24px 22px 12px;}
#zm-navigation-demo .desktop .content {padding:0 22px 28px;}
#zm-navigation-demo .product[data-motion=false] button {transition:none;transform:none;}
#zm-navigation-demo [hidden] {display:none!important;}
@media(max-width:550px) {
 #zm-navigation-demo .stage {padding:10px 0;min-height:1030px;}
 #zm-navigation-demo .desktop .frame {grid-template-areas:'header' 'content' 'nav';grid-template-columns:minmax(0,1fr);}
 #zm-navigation-demo .desktop .navigation {display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:0;border-top:1px solid var(--line);padding:8px 6px 12px;gap:2px;}
 #zm-navigation-demo .desktop .navigation button {flex-direction:column;justify-content:center;gap:6px;font-size:11px;padding:6px 2px;min-height:60px;}
 #zm-navigation-demo .desktop .content {min-height:650px;padding:0 16px 24px;}
 #zm-navigation-demo .desktop .app-header {padding:20px 16px 12px;}
 #zm-navigation-demo .desktop .demo-label {padding-right:90px;}
 #zm-navigation-demo .two {gap:12px;}
 #zm-navigation-demo .amount {font-size:21px;}
 #zm-navigation-demo .row {padding:14px 10px;gap:9px;}
}
@media(prefers-reduced-motion:reduce) {#zm-navigation-demo button {transition:none!important;transform:none!important;}}
</style>

  'mais:impressao':{title:'Impressão e formulários',rows:[['Relatório preenchido','Pré-visualizar, salvar PDF ou imprimir'],['Formulário em branco','Folha para preencher à caneta']]},
  'mais:configuracoes':{title:'Configurações e conexão',rows:[['Aparência','Tema, cores e acessibilidade'],['Conexão com o servidor','Disponibilidade e pareamento']]},
  'mais:backup':{title:'Backup',rows:[['Cópias de segurança','Consultar backups'],['Recuperação','Fluxo com revisão e confirmação']]}
 };
 const states={};
 const snapshot=()=>Object.fromEntries(Object.entries(states).map(([key,s])=>[key,{area:s.area,stacks:s.stacks,design:{...s.design}}]));
 const save=device=>{if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{prototype:'Navegação ZM',device,area:states[device].area,page:states[device].stacks[states[device].area].at(-1),productionImplementation:false},privateContent:{devices:snapshot()}}).catch(()=>{});};
 const icon=name=>{const el=document.createElement('i');el.dataset.lucide=name;el.setAttribute('aria-hidden','true');return el;};
 const make=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;};
 for(const app of root.querySelectorAll('.app')) {
  const device=app.dataset.device;
  app.appendChild(document.getElementById('zm-navigation-shell').content.cloneNode(true));
  const s={area:'inicio',stacks:Object.fromEntries(Object.keys(areas).map(key=>[key,['resumo']])),design:{appearance:'chat',radius:18}};states[device]=s;
  const content=app.querySelector('.content-inner'),title=app.querySelector('.page-title'),back=app.querySelector('.back');
  const renderDesign=()=>{app.style.colorScheme=s.design.appearance==='chat'?'light dark':s.design.appearance;app.style.setProperty('--radius',s.design.radius+'px');};
  const navigate=(area,page='resumo')=>{s.area=area;if(s.stacks[area].at(-1)!==page)s.stacks[area].push(page);render();save(device);};
  function renderDetail(data) {
   if(data.future){const status=make('p','context','Exemplo de uma função planejada');content.appendChild(status);}
   if(data.amount){const hero=make('section','hero');hero.append(make('span','label',data.label),make('div','detail-amount',data.amount));content.appendChild(hero);}
   if(data.lines){const box=make('section','details');for(const [label,value] of data.lines){const row=make('div','detail-line');row.append(make('span','',label),make('span','',value));box.appendChild(row);}content.appendChild(box);}
   if(data.rows){const rows=make('div','rows');data.rows.forEach(([name,description],index)=>{
    const row=make(data.basket&&index===0?'button':'div','row'+(data.basket&&index===0?' cursor-interaction':''));
    const copy=make('span','copy');copy.append(make('span','title',name),make('span','subtitle',description));row.appendChild(copy);
    if(data.basket&&index===0){row.type='button';row.dataset.go='estoque:cesta-basica';const arrow=icon('chevron-right');arrow.className='arrow';row.appendChild(arrow);}rows.appendChild(row);
   });content.appendChild(rows);}
   const note=make('p','note','Dados ilustrativos. Esta prévia mostra onde encontrar as informações.');content.appendChild(note);
  }
  function render() {
   const page=s.stacks[s.area].at(-1),key=s.area+':'+page;
   content.replaceChildren();back.hidden=s.stacks[s.area].length<=1;
   app.querySelectorAll('[data-area]').forEach(button=>{if(button.dataset.area===s.area)button.setAttribute('aria-current','page');else button.removeAttribute('aria-current');});
   if(children[key]){title.textContent=children[key].title;content.appendChild(make('p','context',areas[s.area]));renderDetail(children[key]);}
   else if(s.area==='financeiro'){
    title.textContent='Financeiro';content.appendChild(document.getElementById('zm-nav-financeiro').content.cloneNode(true));
    const tab=['resumo','pagar','receber'].includes(page)?page:'resumo';
    content.querySelectorAll('[data-finance]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.finance===tab)));
    const target=content.querySelector('.finance-content');target.style.display='grid';target.style.gap='20px';target.appendChild(document.getElementById(tab==='resumo'?'zm-nav-financeiro-resumo':'zm-nav-'+tab).content.cloneNode(true));
   }else {title.textContent=areas[s.area];content.appendChild(document.getElementById('zm-nav-'+s.area).content.cloneNode(true));}
   if(globalThis.lucide)lucide.createIcons({attrs:{width:18,height:18}});
  }
  app.addEventListener('click',event=>{
   const button=event.target.closest('button');if(!button||!app.contains(button))return;
   if(button.dataset.area){s.area=button.dataset.area;render();save(device);}
   else if(button.dataset.go){const [area,page]=button.dataset.go.split(':');navigate(area,page);}
   else if(button.dataset.finance){s.stacks.financeiro=[...s.stacks.financeiro.slice(0,-1),button.dataset.finance];render();save(device);}
  });
  back.addEventListener('click',()=>{if(s.stacks[s.area].length>1)s.stacks[s.area].pop();render();save(device);});
  const restore=saved=>{if(!saved)return;if(areas[saved.area])s.area=saved.area;if(saved.stacks)for(const area of Object.keys(areas)){const stack=saved.stacks[area];if(Array.isArray(stack)&&stack.length&&stack.every(page=>typeof page==='string'&&(page==='resumo'||(area==='financeiro'&&['pagar','receber'].includes(page))||children[area+':'+page])))s.stacks[area]=[...stack];}if(saved.design)Object.assign(s.design,saved.design);renderDesign();render();};
  s.restore=restore;restore(window.openai?.widgetState?.privateContent?.devices?.[device]);renderDesign();render();
  if(globalThis.Tweak){const tweak=new Tweak({container:app,onChange:renderDesign});tweak.addSelect(s.design,'appearance',{label:'Aparência',options:[{label:'Seguir o chat',value:'chat'},{label:'Claro',value:'light'},{label:'Escuro',value:'dark'}]});tweak.addSlider(s.design,'radius',{label:'Cantos dos painéis',min:10,max:26,step:2,unit:'px'});}
 }
 window.addEventListener('openai:set_globals',event=>{const saved=event.detail?.globals?.widgetState?.privateContent?.devices;if(saved)for(const [device,s] of Object.entries(states))s.restore(saved[device]);});
})();
</script>
