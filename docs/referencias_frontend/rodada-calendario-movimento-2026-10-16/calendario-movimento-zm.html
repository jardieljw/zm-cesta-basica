<style>

#zm-calendar-motion .table {width:100%;border-collapse:collapse;font-size:14px;}

#zm-calendar-motion .date-dialog {color:var(--zm-ink);background:var(--zm-surface);border:1px solid var(--zm-line);border-radius:var(--zm-panel-radius);width:min(360px,calc(100% - 24px));max-width:calc(100% - 24px);padding:16px;box-shadow:0 20px 60px var(--zm-shadow);}

@keyframes zm-calendar-backdrop-in {from {opacity:0;} to {opacity:1;}}

@media(prefers-reduced-motion:reduce) {#zm-calendar-motion .date-dialog::backdrop {animation:none;}}
#zm-calendar-motion .calendar-heading,#zm-calendar-motion .calendar-period,#zm-calendar-motion .calendar-footer {display:flex;gap:8px;justify-content:space-between;align-items:center;}
#zm-calendar-motion .calendar-heading h3 {font-size:16px;}
#zm-calendar-motion .calendar-period {margin:10px 0;}
#zm-calendar-motion .calendar-period strong {font-size:15px;text-transform:capitalize;}

#zm-calendar-motion .calendar-footer {margin-top:10px;}
#zm-calendar-motion [hidden] {display:none!important;}
#zm-calendar-motion .specimen[data-motion=false] button,#zm-calendar-motion .specimen[data-motion=false] .kind-option,#zm-calendar-motion .specimen[data-motion=false] .partial-reveal {transition:none;transform:none;}
#zm-calendar-motion .specimen[data-motion=false] .busy-icon {animation:none;}
@container(min-width:580px) {#zm-calendar-motion .query-specimen .table-wrap {display:block;}#zm-calendar-motion .query-specimen .rows {display:none;}}
@container(max-width:350px) {#zm-calendar-motion .product-content {padding:22px 14px 24px;}#zm-calendar-motion .panel {padding:18px;}#zm-calendar-motion .review-line {flex-direction:column;gap:5px;}#zm-calendar-motion .review-line dd {text-align:left;}#zm-calendar-motion .row {flex-wrap:wrap;}#zm-calendar-motion .row .copy {flex-basis:65%;}#zm-calendar-motion .row .row-value {margin-left:auto;}}
@media(max-width:450px) {#zm-calendar-motion .stage {min-height:max(1300px,var(--zm-stage-reserve,0px));padding:10px 0;}}
@media(prefers-reduced-motion:reduce) {#zm-calendar-motion .partial-reveal,#zm-calendar-motion .kind-option,#zm-calendar-motion .specimen button {transition:none;}#zm-calendar-motion .busy-icon {animation:none;}}
#zm-calendar-motion .specimen {--zm-control-edge:light-dark(#7d8796,#7a8495);--zm-field-gap:20px;--zm-panel-inset:24px;}
#zm-calendar-motion .product-content,#zm-calendar-motion .panel {gap:var(--zm-field-gap);}

#zm-calendar-motion .money-entry {border-radius:var(--zm-field-radius);}
#zm-calendar-motion .money-entry input {border-radius:inherit;}
#zm-calendar-motion .specimen ::placeholder {color:var(--zm-sub);opacity:1;}
#zm-calendar-motion .specimen button {transition:transform 160ms ease;}
#zm-calendar-motion .kind-option {transition:box-shadow 180ms ease;}

@container(max-width:350px) {#zm-calendar-motion .panel {padding:min(20px,var(--zm-panel-inset));}}
</style>
<div id="zm-calendar-motion" class="viz-carousel viz-dotted-background" aria-label="Fundamentos visuais compartilhados ZM" data-previous-label="Anterior" data-next-label="Próxima">
 <section class="stage" data-variant="Formulário" aria-label="Campos e escolhas">
  <div class="specimen" data-example="fields" aria-label="Campos e escolhas"><div class="study-label">Estudo visual · dados fictícios</div><div class="product-content"></div></div>
 </section>
 <section class="stage" data-variant="Estados dos controles" aria-label="Ações e respostas" hidden>
  <div class="specimen" data-example="actions" aria-label="Ações e respostas"><div class="study-label">Estudo visual · respostas simuladas</div><div class="product-content"></div></div>
 </section>
 <section class="stage" data-variant="Lista e detalhe" aria-label="Resumo e lista" hidden>
  <div class="specimen query-specimen" data-example="query" aria-label="Resumo e lista"><div class="study-label">Estudo visual · dados fictícios</div><div class="product-content"></div></div>
 </section>
</div>
<script>
(() => {
 const root=document.getElementById('zm-calendar-motion');
 const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const money=cents=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(cents/100);
 const validDate=value=>{if(typeof value!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(value))return false;const [y,m,d]=value.split('-').map(Number);return y>=1900&&y<=9999&&new Date(Date.UTC(y,m-1,d)).toISOString().slice(0,10)===value;};
 const dateLabel=value=>new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(value+'T00:00:00Z'));
 const parseMoney=value=>{const clean=value.trim().replace(/^R\$\s*/,'');if(!/^(?:\d+|\d{1,3}(?:\.\d{3})+)(?:,\d{1,2})?$/.test(clean))return null;const [whole,part='']=clean.replaceAll('.','').split(',');const cents=Number(whole)*100+Number(part.padEnd(2,'0'));return Number.isSafeInteger(cents)?cents:null;};
 const contexts={receive:{title:'Registrar recebimento',person:'Ana Souza · Venda #1042',balance:10000,noun:'recebimento',verb:'recebeu',adjective:'recebido',methods:{PIX:'Pix',CASH:'Dinheiro',CARD:'Cartão',OTHER:'Outro'}},pay:{title:'Registrar pagamento',person:'Fornecedor de alimentos · Conta #208',balance:68000,noun:'pagamento',verb:'pagou',adjective:'pago',methods:{PIX:'Pix',DINHEIRO:'Dinheiro',CARTAO_CREDITO:'Cartão de crédito',BOLETO:'Boleto',TRANSFERENCIA:'Transferência',CHEQUE:'Cheque',OUTRO:'Outro'}}};
 const blankDraft=()=>({mode:'full',amount:'',date:'2026-10-16',method:'',notes:''});
 const preferences=window.matchMedia('(prefers-reduced-motion:reduce)');
 const foundation={appearance:'chat',page:'soft',accent:'#2866ae',spacing:20,panelRadius:32,fieldRadius:24,motion:'standard'};
 const rgb=hex=>hex.slice(1).match(/../g).map(value=>parseInt(value,16));
 const hex=channels=>'#'+channels.map(value=>Math.round(value).toString(16).padStart(2,'0')).join('');
 const blend=(a,b,f)=>hex(rgb(a).map((value,index)=>value*(1-f)+rgb(b)[index]*f));
 const luminance=color=>rgb(color).map(value=>{const c=value/255;return c<=.04045?c/12.92:((c+.055)/1.055)**2.4;}).reduce((sum,value,index)=>sum+value*[.2126,.7152,.0722][index],0);
 const contrast=(a,b)=>{const values=[luminance(a),luminance(b)].sort((x,y)=>y-x);return (values[0]+.05)/(values[1]+.05);};
 function readableTone(seed,backgrounds,dark){for(let step=0;step<=100;step++){const tone=blend(seed,dark?'#ffffff':'#000000',step/100);if(backgrounds.every(background=>contrast(tone,background)>=4.5))return tone;}return dark?'#ffffff':'#000000';}
 function foundationPalette(dark){
  const pure=foundation.page==='pure',page=dark?(pure?'#000000':'#141518'):(pure?'#ffffff':'#f6f7f9'),surface=dark?(pure?'#1c1e23':'#24262b'):'#ffffff';
  const soft=blend(foundation.accent,dark?'#141518':'#ffffff',dark ? .77 : .93);
  return {page,surface,soft,accent:readableTone(foundation.accent,[page,surface,soft,dark?'#142032':'#ffffff'],dark),accentInk:dark?'#142032':'#ffffff',field:dark?(pure?'#08090b':'#141518'):'#f6f7f9'};
 }
 function applyFoundation(app){
  const light=foundationPalette(false),dark=foundationPalette(true),pairs={page:'page',surface:'surface',soft:'soft',accent:'accent','accent-ink':'accentInk'};
  for(const layer of [app,...app.querySelectorAll('.product-content,.product-content > *,.panel,.field,.kind-option,.row,.message')]){
   layer.style.colorScheme=foundation.appearance==='chat'?'light dark':foundation.appearance;
   for(const [token,key] of Object.entries(pairs))layer.style.setProperty('--zm-'+token,`light-dark(${light[key]},${dark[key]})`);
   layer.style.setProperty('--zm-panel-radius',foundation.panelRadius+'px');layer.style.setProperty('--zm-field-radius',foundation.fieldRadius+'px');layer.style.setProperty('--zm-field-gap',foundation.spacing+'px');layer.style.setProperty('--zm-panel-inset',Math.min(24,foundation.spacing)+'px');
   layer.style.setProperty('--zm-field',`light-dark(${light.field},${dark.field})`);
  }
  app.dataset.motion=String(foundation.motion!=='reduced'&&!preferences.matches);
  if(app.dataset.motion==='false')app.getAnimations({subtree:true}).forEach(animation=>animation.cancel());
 }
 function renderFoundation(){for(const app of root.querySelectorAll('.specimen'))applyFoundation(app);}
 const states={};
 const canonicalSnapshot=value=>JSON.stringify((function ordered(item){return Array.isArray(item)?item.map(ordered):item&&typeof item==='object'?Object.fromEntries(Object.keys(item).sort().map(key=>[key,ordered(item[key])])):item;})(value??null));
 const initialPrivateState=window.openai?.widgetState?.privateContent??null;
 const initialSignature=canonicalSnapshot(initialPrivateState);
 const snapshotEchoes=new Set([initialSignature]);
 function rememberSnapshot(saved){const signature=canonicalSnapshot(saved);snapshotEchoes.add(signature);if(snapshotEchoes.size>128){for(const candidate of snapshotEchoes)if(candidate!==initialSignature){snapshotEchoes.delete(candidate);break;}}return signature;}
 const registerExampleTweaks=[];
 const snapshot=()=>Object.fromEntries(Object.entries(states).map(([key,s])=>[key,{design:{...s.design},draft:{...s.draft},page:s.page,operation:s.operation,balance:s.balance,queryRange:s.queryRange,querySource:s.querySource}]));
 function save(example) {
  if(!window.openai?.setWidgetState)return;
  const privateContent={foundationVersion:3,foundation:{...foundation},examples:snapshot()};
  rememberSnapshot(privateContent);
  window.openai.setWidgetState({modelContent:{prototype:'Fundamentos visuais ZM',example,foundation:{...foundation},context:states.fields.design.context,operation:states.actions.operation,query:states.query.design.query,productionImplementation:false},privateContent}).catch(()=>{});
 }
 function icons(){globalThis.lucide?.createIcons({attrs:{width:18,height:18}});}
 function rows(items) {return `<dl class="review-list">${items.map(([label,value])=>`<div class="review-line"><dt>${esc(label)}</dt><dd>${esc(value)}</dd></div>`).join('')}</dl>`;}
 function heading(title,subtitle='Financeiro / Receber') {return `<header class="heading"><p class="eyebrow">${esc(subtitle)}</p><h2>${esc(title)}</h2></header>`;}
 function primary(label,action,disabled=false,icon='arrow-right'){return `<button type="button" class="primary cursor-interaction" data-action="${action}" ${disabled?'disabled':''}>${icon?`<i data-lucide="${icon}" aria-hidden="true" ${icon==='loader-circle'?'class="busy-icon"':''}></i>`:''}${label}</button>`;}
 function secondary(label,action){return `<button type="button" class="secondary cursor-interaction" data-action="${action}">${label}</button>`;}
 for(const app of root.querySelectorAll('.specimen')) {
  const example=app.dataset.example,content=app.querySelector('.product-content');
