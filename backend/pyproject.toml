[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "zm-estoque-backend"
version = "0.1.0"
description = "Backend FastAPI para Sistema de Gestao de Estoque de Cestas ZM"
readme = "README.md"
requires-python = ">=3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]
