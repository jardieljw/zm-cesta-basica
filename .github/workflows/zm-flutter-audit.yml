name: ZM Flutter audit (isolated)
on:
  push:
    branches:
      - 'audit/zm-design-system-flutter-ci-*'
  pull_request:
    paths:
      - 'client/**'
      - 'design_lab/**'
      - '.github/workflows/zm-flutter-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zm-flutter-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  current-client:
    name: Current app / Flutter SDK and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter and Dart versions
        run: flutter --version
      - name: Resolve current app dependencies
        working-directory: client
        run: flutter pub get
      - name: Analyze app (baseline; warnings are visible)
        working-directory: client
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run app widget/model tests
        working-directory: client
        run: flutter test --reporter expanded

  design-laboratory:
    name: FE-052 isolated candidate / widget tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve lab dependencies
        working-directory: design_lab
        run: flutter pub get
      - name: Analyze design laboratory
        working-directory: design_lab
        run: flutter analyze --fatal-infos
      - name: Run design lab widget tests
        working-directory: design_lab
        run: flutter test --reporter expanded
      - name: Audit warning: golden fidelity NOT certified
        run: |
          echo "::warning::The candidate passes structural/functional checks only. No approved Flutter golden exists."
          echo "Golden homologation required; do not use as final FE-052 design."
